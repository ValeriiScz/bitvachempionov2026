<!DOCTYPE html>
<!--
  DOVOD · watch2.html · новая смотровая турнира · v1.7 · 2026-11-15
  Назначение: эфир и вся информация о турнире на одной странице. Один файл на все турниры: watch2.html?id=664.
  Прежние смотровые watch{id}.html переадресуют сюда; открыть прежнюю - watch{id}.html?old=1.
  Данные: те же источники, что у live.html - data/tournaments.js, participants/tournament/avatars/streams_{id}.json,
  Google-таблица правок (data/gsheet.js), игры - data/live.js (опрос раз в 20 секунд).
  Оглавление: 1) стили  2) расчёты (core)  3) общие блоки (ui)  4) логика страницы
  Режимы: «Эфир», «Все столы» (большой + остальные / сетка; телефон боком - на весь экран), «Турнир».
  Вкладки: Таблица · Столы · Дальше · Мои. Сила стола - метод и названия сайта (спокойный · мягкий · ровный · сильный · элитный).
  v1.7 (15.11): в таблице колонка «игр» - сколько игр пошло в зачёт; у кого меньше, чем у лидеров по числу игр, - оранжевым.
  v1.6 (15.11): компьютер - «◧ скрыть таблицы» (эфиры на всю ширину), эфиры вписываются в высоту окна; номера игр переносятся в строки (раньше 11+ были недоступны); места за столом подряд - 1-5 слева, 6-10 справа.
  v1.5 (14.11): «Мои» с телефона - поиск с подсказками-кнопками (вместо datalist), ✕ у каждого игрока.
  v1.4 (14.11): телефон, режим «Турнир» - кнопки звука и «в лайв» не налезают на мини-эфир, они в подписи рядом.
  v1.3 (14.11): вернул «⏭ в лайв» / «⏭ все в лайв» (как в прежних смотровых).
  v1.2 (14.11): стала основной - watch{id}.html переадресуют сюда (прежняя - watch{id}.html?old=1);
  пока у турнира нет рассадки - возвращает на прежнюю смотровую (там анонс и эфиры до старта).
  v1.1 (14.11): сразу из последнего снимка, свежие протоколы в фоне; без снимка - понятное «загружаю протоколы».
  История: v1.0 - из прототипов _preview_watch_v0.1-0.2 (в _Архив) с правками Валерия 14.11: кружочки в «Дальше»,
  сила стола по методу сайта, компактные «Мои».
-->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>

.sb.hot i.on{background:#e0405a}

.seats.one{grid-template-columns:minmax(0,1fr)}
.seat .dp{font-size:11px;min-width:38px;text-align:right}.seat .pt{min-width:40px;text-align:right}
.circ{display:flex;flex-wrap:wrap;gap:3px}.circ span{display:inline-flex;border-radius:50%}.circ span.me{box-shadow:0 0 0 2px var(--ac)}
.gc{cursor:default}
#__refbtn,#__hidnote{display:none!important}

.golv{min-height:32px;padding:0 10px;border-radius:9px;border:1px solid rgba(255,107,107,.6);background:rgba(0,0,0,.78);color:#ff8a86;font:700 12px Inter,sans-serif;white-space:nowrap}

.bar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(7,9,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.bar .bk{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);flex:none;display:flex;align-items:center;justify-content:center}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ln);background:var(--bg)}

.minicap{display:none}

.under{display:none}
.ng{border:1px solid var(--ln);border-radius:12px;background:var(--p);margin-bottom:10px;overflow:hidden}

.ng .gh b{font-size:13px}.ng .ln{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:7px 10px;border-bottom:1px solid var(--ln);font-size:12px;align-items:start}
.ng .ln:last-child{border-bottom:0}.ng .ln .who{color:#b8c0cc;line-height:1.5}.ng .ln .who b{color:var(--ac)}
.myc{border:1px solid var(--ln);border-radius:12px;background:var(--p);padding:10px;margin-bottom:10px}

.myc .nowl{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#1b1707;border:1px solid #5a4a10;margin-bottom:8px;font-size:13px}.myc .nowl span{flex:1}
.myc .ch{display:flex;flex-wrap:wrap;gap:5px}
.ng .ln{grid-template-columns:96px 1fr!important;align-items:center!important}

.myr{border-bottom:1px solid var(--ln)}

.myr .tp .nm{flex:1;min-width:0}.myr .tp .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.myr .tp .nm small{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.myr .tp .pl{text-align:right;flex:none;font:700 14px 'JetBrains Mono',monospace;color:var(--ac)}.myr .tp .pl small{display:block;font:400 10px 'JetBrains Mono',monospace;color:var(--mu)}
.myr .chv{color:var(--mu);width:32px;height:40px;text-align:center;flex:none;font-size:13px}
.myr .x{color:var(--mu);width:32px;height:40px;flex:none;font-size:14px;border-left:1px solid var(--ln)}
.addl{display:grid;gap:4px;margin:6px 0 4px}.addl button{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--ln);text-align:left}.addl button span:not(.av){flex:1;font-weight:600}.addl button small{color:var(--mu)}.addl button b{color:var(--ac);font-size:16px}.myr.open .chv{transform:rotate(180deg)}

.auto{display:flex;gap:8px;align-items:center;font-size:12px;color:#b8c0cc;margin:8px 0}.auto input{width:18px;height:18px;accent-color:var(--ac)}

/* режим «Турнир» на телефоне: видео в углу */
.app[data-mode=info] .stage{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--ln)}
.app[data-mode=info] .video{width:128px;flex:none;border-radius:8px}
.app[data-mode=info] .video .ph span,.app[data-mode=info] .video .ph b{display:none}
.app[data-mode=info] .chips{display:none}
.app[data-mode=info] .vctl{display:none}
.minicap .mc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.minicap .mc .golv,.minicap .mc .sndb{min-height:32px;padding:0 9px;font-size:12px}
.app[data-mode=info] .minicap{display:block;flex:1;min-width:0;font-size:12px;color:var(--mu)}.app[data-mode=info] .minicap b{display:block;color:var(--tx);font-size:13px}
.only-d{display:none!important}
.panel>.tabs{display:none}

.multi .cell .ph span{display:none}.multi .cell:not(.main) .ph em{width:30px;height:30px;font-size:12px}

.app[data-mode=all] .allbar{display:flex}

#modes button span{display:none}#modes button.on span{display:inline}#modes button{min-width:40px}
.panel,.top,.secs,.sec{min-width:0}
/* телефон боком: эфиры на весь экран */
@media(orientation:landscape) and (max-height:520px){
  .bar,.chips,.allbar,.under,.top .tabs,.panel,.foot,.minicap{display:none!important}
  .top{position:fixed;inset:0;z-index:50;top:0}
  .app[data-mode] .stage{display:block;padding:0;border:0;height:100dvh}
  .app[data-mode] #vid{width:100%;height:100dvh;aspect-ratio:auto;border-radius:0}
  #vid.multi{grid-template-columns:repeat(var(--lc,2),minmax(0,1fr));grid-auto-rows:1fr;gap:2px}
  #vid.multi .cell{aspect-ratio:auto;grid-column:auto!important;order:0!important}
}
@media(min-width:1000px){
  .only-d{display:inline-flex!important}.only-m{display:none!important}
  #modes button span{display:inline}
  .allbar{padding:0 0 8px}
  .bar{padding:0 20px;gap:14px}.bar .ti b{font-size:16px}
  .app{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,34vw,430px);gap:16px;padding:16px 20px;align-items:start}
  .top{position:sticky;top:68px}
  .top .video{border-radius:14px}
  .top .tabs{display:none}
  .chips{padding:10px 0}
  .under{display:block;margin-top:2px}
  .panel{position:sticky;top:68px;max-height:calc(100vh - 84px);display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:14px;background:var(--p);overflow:hidden}

  .panel .secs{overflow:auto;flex:1}
  .tbl{border:0;border-radius:0;margin:-10px}.sec#s-table .q{margin-bottom:10px}

<script>/* DOVOD v2 core · общие данные и расчёты новой смотровой (watch2.html) и нового live-центра (live2.html) */
window.__liveSoft=1;window._autoref=1; /* без автоперезагрузки страницы - опрашиваем сами */

const TIERC={L:'#ff4d6d',S:'#ff9f43',A:'#f5d76e',B:'#7ce6a0',C:'#7fd8ff',D:'#8e99b3',E:'#5f6779',F:'#4b5160','':'#3a4250'};
const DATA={t:{},snap:''};
const DB=(window.TOURNAMENTS_DB&&TOURNAMENTS_DB.tournaments)||[];
/* линия в таблице: финал топ-10 (по умолчанию), у турниров без финала - призы (как в live.html) */
const CUT={664:{n:3,lab:'призовые места'},757:{n:3,lab:'призовые места'}};
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function prg(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Prague'}));}

/* ---------- загрузка турнира (тот же набор источников, что у live.html и смотровых) ---------- */
function adapt(games){return (games||[]).map(g=>({st:g.stage,tb:(g.tables||[]).map(tb=>({n:tb.table_num,w:{red_win:'r',black_win:'b'}[tb.winner]||null,
  s:(tb.seats||[]).filter(q=>q&&q.name).map(q=>[q.seat,q.name,RC[q.role]||'',+q.sigma||0,+q.aps||0,+q.wpts||0,+q.ci||0,+q.kf||0,+q.bmb||0])}))}));}
async function loadT(id){
  id=String(id);const m=DB.find(x=>String(x.id)===id)||{id};
  const J=(u,o)=>fetch(u,o).then(r=>r.ok?r.json():null).catch(()=>null);
  const [P,TJ,A]=await Promise.all([J('data/participants_'+id+'.json'),J('data/tournament_'+id+'.json',{cache:'no-store'}),J('data/avatars_'+id+'.json')]);
  const tj=TJ||{},avs=(A&&A.avatars)||{},pl={};
  ((P&&P.players)||[]).forEach(p=>{const mm=(p.ms&&p.ms.rating)||p.r_ms_mmr;pl[p.nick]=[mm?Math.round(mm):null,p.r_ms_tier||'',avs[p.nick]||p.av||'',p.flag||''];});
  try{const sj=await J('data/streams_'+id+'.json?cb='+Date.now(),{cache:'no-store'});if(sj&&sj.days){window.STREAMS_DB=window.STREAMS_DB||{};STREAMS_DB[id]=sj;}}catch(e){}
  if(window.DOVOD_SHEET){try{const ss=await DOVOD_SHEET.streams(id);if(ss&&ss.n){const b=Object.assign({gamesDay1:6,days:{}},(window.STREAMS_DB||{})[id]||{});b.days=JSON.parse(JSON.stringify(b.days||{}));
    Object.keys(ss.days).forEach(d=>{b.days[d]=Object.assign(b.days[d]||{},ss.days[d]);});if(ss.final)b.final=ss.final;b.test=false;window.STREAMS_DB=window.STREAMS_DB||{};STREAMS_DB[id]=b;}}catch(e){}}
  const c=CUT[id]||{n:10,lab:'выход в финал'};
  const a=tj.live_from||m.liveFrom||m.start,b=tj.live_to||m.liveTo||a,td=ymd(prg());
  const t=DATA.t[id]={id,name:cln(m.name||tj.tournament_name||('Турнир '+id)),short:cln(tj.short||m.name||('Турнир '+id)),city:m.city||'',country:m.country||'',stars:m.stars||0,np:m.players||Object.keys(pl).length,
    accent:m.accent||tj.accent||'#ffce00',color:m.accent||tj.accent||'#ffce00',page:m.page||'',prize:m.prize||'',judges:tj.referees_by_table||{},cut:c.n,cutLabel:c.lab,pl,games:[],gt:0,
    inWin:!!a&&td>=a&&td<=b,status:m.status||''};
  /* сразу - последний снимок игр с этого устройства; свежие протоколы подтягиваются в фоне (mafgame бывает медленным, до 30 с) */
  try{const sv=JSON.parse(localStorage.getItem('dv2_g_'+id)||'null');if(sv&&sv.length){t.games=sv;t.gt=sv.length;t._cached=true;}}catch(e){}

}
async function refreshT(id){const t=DATA.t[id];if(!t)return false;let G=null;try{G=window.loadGames?await window.loadGames(id):null;}catch(e){}
  t._tried=true;if(!G||!G.games||!G.games.length)return false;const g=adapt(G.games),sig=JSON.stringify(g);t._cached=false;if(sig===t._sig)return false;t._sig=sig;t.games=g;t.gt=g.length;t._ts=null;
  try{localStorage.setItem('dv2_g_'+id,sig);}catch(e){}
  g.forEach(x=>x.tb.forEach(tb=>tb.s.forEach(s=>{if(!t.pl[s[1]])t.pl[s[1]]=[null,'','',''];})));return true;}
/* опрос: раз в 20 с, вкладка в фоне не опрашивает */
function poll(ids,cb){setInterval(async()=>{if(document.hidden)return;let ch=false;for(const id of ids){const t=DATA.t[id];if(t&&(t.inWin||!finished(t)))ch=(await refreshT(id))||ch;}stamp();cb(ch);},20000);
  document.addEventListener('visibilitychange',async()=>{if(document.hidden)return;let ch=false;for(const id of ids)ch=(await refreshT(id))||ch;stamp();cb(ch);});}
/* разные турниры - разные цвета: свой акцент, если он не сливается с уже занятыми, иначе следующий из запасных */
function hue(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 0;const n=parseInt(m[1],16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;
  let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;return h<0?h+360:h;}
function assignColors(ts){const spare=['#4cc9f0','#c77dff','#7ae582','#ff8fab','#ff9f1c','#9db4ff'],used=[];const far=(c)=>used.every(u=>{const d=Math.abs(hue(u)-hue(c));return Math.min(d,360-d)>=45;});
  ts.forEach(t=>{let c=t.accent;if(!far(c))c=spare.find(far)||spare[used.length%spare.length];t.color=c;used.push(c);});}

/* ---------- расчёты ---------- */
function tPlayed(tb){return !!tb.w;}
function isFinG(t,g){return !!g&&g.st==='Финал'&&t.games.some(x=>x.st!=='Финал');}
function curGame(t){for(let i=0;i<t.games.length;i++){if(!t.games[i].tb.every(tPlayed))return i;}return Math.max(0,t.games.length-1);}
function lastGame(t){let r=-1;t.games.forEach((g,i)=>{if(g.tb.some(tPlayed))r=i;});return r;}
function playedCount(t){return t.games.filter(g=>g.tb.length&&g.tb.every(tPlayed)).length;}
function finished(t){return t.games.length>0&&t.games.every(g=>g.tb.every(tPlayed));}
function standings(t,skip){
  const m={};
  t.games.forEach((g,gi)=>{if(gi===skip)return;g.tb.forEach(tb=>{if(!tb.w)return;tb.s.forEach(s=>{
    const a=m[s[1]]=m[s[1]]||{n:s[1],sum:0,g:0,w:0,ci:0};a.sum+=s[3];a.g++;a.ci+=s[6];if(s[5]>0)a.w++;});});});
  Object.keys(t.pl).forEach(n=>{if(!m[n])m[n]={n,sum:0,g:0,w:0,ci:0};});
  const arr=Object.values(m).sort((a,b)=>b.sum-a.sum||b.w-a.w||a.n.localeCompare(b.n));
  arr.forEach((a,i)=>a.pos=i+1);return arr;
}
function table(t){
  const lg=lastGame(t),now=standings(t),was=lg>0?standings(t,lg):null,wp={};
  if(was)was.forEach(a=>wp[a.n]=a.pos);
  const last={};
  if(lg>=0)t.games[lg].tb.forEach(tb=>{if(tb.w)tb.s.forEach(s=>last[s[1]]={v:s[3],r:s[2],tb:tb.n,win:s[5]>0});});
  now.forEach(a=>{a.d=was&&a.g?wp[a.n]-a.pos:0;a.last=last[a.n]||null;});
  return {rows:now,lg};
}
function path(t,n){const r=[];t.games.forEach((g,gi)=>g.tb.forEach(tb=>tb.s.forEach(s=>{if(s[1]===n)r.push({gi,tb:tb.n,seat:s[0],role:s[2],v:s[3],aps:s[4],win:s[5]>0,played:!!tb.w,kf:s[7],ci:s[6],w:tb.w,fin:isFinG(t,g)});})));return r;}
function whereIs(t,gi,n){const g=t.games[gi];if(!g)return null;for(const tb of g.tb){const s=tb.s.find(x=>x[1]===n);if(s)return {tb:tb.n,seat:s[0],o:tb};}return null;}
/* сила стола - метод сайта: очки по тирам MMR (L4 S3 A2 B1), категория - отклонение от всех столов этого турнира (как в live.html и на страницах турнира) */
const TPTS={L:4,S:3,A:2,B:1};
const SCAT=[['спокойный','#3fa7c4'],['мягкий','#6f93b4'],['ровный','#c9a74a'],['сильный','#e07a3c'],['элитный','#e0405a']];
function tpts(t,tb){return tb.s.reduce((a,s)=>a+(TPTS[(t.pl[s[1]]||[])[1]]||0),0);}
function tstat(t){if(t._ts)return t._ts;const v=[];t.games.forEach(g=>{if(isFinG(t,g))return;g.tb.forEach(tb=>{if(tb.s.length>=6)v.push(tpts(t,tb));});});
  const m=v.length?v.reduce((a,b)=>a+b,0)/v.length:0,sd=v.length>1?Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length-1)):0;return t._ts={m,sd};}
function strength(t,tb){const st=tstat(t);let lv=2;if(st.sd&&tb.s.length>=6){const z=(tpts(t,tb)-st.m)/st.sd;lv=z>=2?4:z>=1?3:z>-1?2:z>-2?1:0;}
  const ms=tb.s.map(s=>(t.pl[s[1]]||[])[0]).filter(Boolean);return {lv,word:SCAT[lv][0],col:SCAT[lv][1],mmr:ms.length?Math.round(ms.reduce((a,b)=>a+b,0)/ms.length):null};}
/* линейка: пусто - спокойный, 1 - мягкий, 2 - ровный, 3 - сильный, 3 красные - элитный */
function stBars(x){const n=x.lv===4?3:x.lv;return `<span class="sb${x.lv===4?' hot':''}" title="сила стола: ${x.word}${x.mmr?' · средний MMR '+x.mmr:''}">${[0,1,2].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;}
function stHTML(x,o){o=o||{};return `${stBars(x)}${o.word===false?'':`<span class="sw" style="color:${x.col}">${x.word}</span>`}${x.mmr&&o.mmr!==false?`<span class="st num">MMR ${x.mmr}</span>`:''}`;}
/* эфир стола: правила как в live.html - день по дате (dayDates), иначе по номеру игры; финал - отдельный эфир */
function SDB(id){return (window.STREAMS_DB&&STREAMS_DB[id])||null;}
function streamId(t,tb,gi){const st=SDB(t.id);if(!st)return null;const g=t.games[gi];if(isFinG(t,g))return st.final||null;
  let d=null;const c=curGame(t);
  if(gi===c||gi==null){const dd=st.dayDates,td=ymd(prg());if(dd)Object.keys(dd).forEach(k=>{if(td>=dd[k])d=k;});}
  if(!d){const q=t.games.slice(0,(gi==null?c:gi)+1).filter(x=>x.st!=='Финал').length;d=q<=(st.gamesDay1||6)?'1':'2';}
  return ((st.days||{})[d]||{})[String(tb)]||null;}
function playerHTML(t,tb,gi,opt){
  opt=opt||{};const id=streamId(t,tb,gi),lab=`Стол ${ROM[tb]||tb}`;
  if(!id)return `<div class="ph"><b>${esc(opt.cap||lab)}</b><span>эфир этого стола появится перед началом</span></div>`;
  if(/^url:/.test(id))return `<a class="ph" href="${esc(id.slice(4))}" target="_blank" rel="noopener"><em>▶</em><b>${esc(opt.cap||lab)}</b><span>эфир открывается на YouTube</span></a>`;
  if(!ONSITE)return `<a class="ph" href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener"><em>▶</em><b>${esc(opt.cap||lab)}</b><span>файл открыт с диска - эфир на YouTube</span></a>`;
  const base=/^live:/.test(id)?'https://www.youtube.com/embed/live_stream?channel='+encodeURIComponent(id.slice(5))+'&':'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?';
  return `<iframe data-tb="${tb}" data-k="${esc(t.id+'-'+tb)}" src="${base}autoplay=1&mute=${opt.sound&&window.__snd?0:1}&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" title="${esc(lab)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}
/* звук без перезагрузки плеера: команды YouTube через postMessage (как в текущих смотровых) */
function ytCmd(fr,func){try{fr.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*');}catch(e){}}
/* «⏭ в лайв»: плееры сообщают длительность эфира; перемотка за конец у live-эфира YouTube ставит на самый свежий момент.
   Если плеер ещё не отдал длительность - перезагружаем окно (старт сразу с live). Тот же приём, что в прежних смотровых (goLive). */
const YTD=new WeakMap();
window.addEventListener('message',e=>{if(!/youtube/.test(e.origin))return;let d;try{d=JSON.parse(e.data);}catch(x){return;}
  const fr=[...document.querySelectorAll('iframe[data-k]')].find(f=>f.contentWindow===e.source);if(!fr)return;const st=YTD.get(fr)||{};st.ok=1;
  if(d.info){if(d.info.duration)st.dur=d.info.duration;if(d.info.progressState&&d.info.progressState.seekableEnd)st.dur=d.info.progressState.seekableEnd;if(d.info.muted!==undefined)st.muted=d.info.muted;}YTD.set(fr,st);});
setInterval(()=>{document.querySelectorAll('iframe[data-k]').forEach(f=>{const st=YTD.get(f);if(st&&st.ok)return;try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:f.dataset.k,channel:'widget'}),'*');}catch(x){}});},2000);
function goLive(root){let n=0;(root||document).querySelectorAll('iframe[data-k]').forEach(fr=>{const st=YTD.get(fr)||{};
  if(st.dur){try{fr.contentWindow.postMessage(JSON.stringify({event:'command',func:'seekTo',args:[st.dur+3600,true]}),'*');}catch(x){}ytCmd(fr,'playVideo');}
  else{const u=fr.getAttribute('src');fr.setAttribute('src','about:blank');setTimeout(()=>fr.setAttribute('src',u),60);YTD.delete(fr);}n++;});
  toast(n?(n>1?'Все эфиры - на самый свежий момент':'Эфир - на самый свежий момент'):'Нет запущенных эфиров');}
function toast(m){let el=document.getElementById('dvtoast');if(!el){el=document.createElement('div');el.id='dvtoast';document.body.appendChild(el);}el.textContent=m;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200);}
function liveBtn(all){return `<button class="golv" data-act="golive" title="Перемотать ${all?'все эфиры':'эфир'} на самый свежий момент и запустить">⏭ ${all?'все в лайв':'в лайв'}</button>`;}
/* звук включается только после нажатия человека (иначе браузер не запустит эфир): до этого все плееры без звука */
window.__snd=false;
function sndBtn(){return `<button class="sndb${window.__snd?' on':''}" data-act="snd">${window.__snd?'🔊 звук':'🔇 включить звук'}</button>`;}
function soundTo(root,key){root.querySelectorAll('iframe[data-k]').forEach(fr=>ytCmd(fr,fr.dataset.k===key?'unMute':'mute'));}
function avMono(n){return esc(String(n).replace(/[^A-Za-zА-Яа-яЁё0-9]/g,'').slice(0,2).toUpperCase());}
function avErr(im){const s=document.createElement('span');s.className='av mono';s.title=im.title;s.style.cssText=im.style.cssText;s.textContent=String(im.title).replace(/[^A-Za-zА-Яа-яЁё0-9]/g,'').slice(0,2).toUpperCase();im.replaceWith(s);}
function av(t,n,sz){const p=t.pl[n]||[],c=TIERC[p[1]||'']||TIERC[''];sz=sz||26;const fs=sz<24?8:10;
  return p[2]?`<img class="av" loading="lazy" title="${esc(n)}" style="width:${sz}px;height:${sz}px;border-color:${c};font-size:${fs}px" src="${esc(p[2])}" alt="" onerror="avErr(this)">`
    :`<span class="av mono" title="${esc(n)}" style="width:${sz}px;height:${sz}px;border-color:${c};font-size:${fs}px">${avMono(n)}</span>`;}
function winLab(w){return w==='r'?'победа красных':w==='b'?'победа чёрных':'';}
function stars(n){return '★'.repeat(n||0);}
function feed(ts,lim){const r=[];ts.forEach(t=>t.games.forEach((g,gi)=>g.tb.forEach(tb=>{if(!tb.w)return;const best=tb.s.slice().sort((a,b)=>b[3]-a[3])[0];r.push({t,gi,tb:tb.n,o:tb,w:tb.w,best});})));
  return r.sort((a,b)=>b.gi-a.gi||a.tb-b.tb).slice(0,lim||8);}
/* короткая стата игрока в турнире */
function pstat(t,n){const p=path(t,n).filter(x=>x.played),T=table(t),a=T.rows.find(x=>x.n===n);const red=p.filter(x=>x.role==='c'||x.role==='s'),blk=p.filter(x=>x.role==='m'||x.role==='d');
  return {pos:a?a.pos:null,of:T.rows.length,d:a?a.d:0,sum:a?a.sum:0,g:p.length,w:p.filter(x=>x.win).length,rg:red.length,rw:red.filter(x=>x.win).length,bg:blk.length,bw:blk.filter(x=>x.win).length,
    aps:p.reduce((s,x)=>s+x.aps,0),kf:p.filter(x=>x.kf).length,last:a&&a.last};}

<script>/* общие блоки: таблица, столы игры, кружочки состава, строка «моего игрока» */
function mvHTML(d){return d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv dn">▼${-d}</span>`:`<span class="mv mu">·</span>`;}
function chipG(x){return x.played
  ?`<span class="gc ${x.win?'w':'l'}" title="игра ${x.gi+1} · стол ${ROM[x.tb]} · место ${x.seat}"><b>${x.fin?'Ф':'И'}${x.gi+1}</b><span class="mu">${ROM[x.tb]}</span><span class="role ${ROLE[x.role]?ROLE[x.role][1]:''}">${ROLE[x.role]?ROLE[x.role][0]:'?'}</span><span class="num ${x.v>0?'pos':x.v<0?'neg':'mu'}">${sgn(x.v)}</span>${x.kf?'<span title="убит первым">✝</span>':''}</span>`
  :`<span class="gc f" title="игра ${x.gi+1} · стол ${ROM[x.tb]} · место ${x.seat}"><b>${x.fin?'Ф':'И'}${x.gi+1}</b><span class="mu">${ROM[x.tb]} · м.${x.seat}</span></span>`;}
function rowHTML(t,a,o){
  const me=o.follow.includes(a.n),L=a.last;
  const lst=L?`<span class="lst num ${L.v>0?'pos':L.v<0?'neg':'mu'}" title="${L.win?'победа':'поражение'}, стол ${ROM[L.tb]}">${sgn(L.v)}</span>`:`<span class="lst mu"></span>`;
  let h=`<button class="row${a.pos<=t.cut?' pz':''}${me?' me':''}" data-act="open" data-n="${esc(a.n)}"><span class="ps num">${a.pos}</span>${mvHTML(a.d)}${av(t,a.n)}<span class="nm">${esc(a.n)}</span>${lst}<span class="gp num${a.g<o.gmax?' lag':''}" title="сыграно игр: ${a.g}${a.g<o.gmax?' - на '+(o.gmax-a.g)+' меньше лидеров по числу игр':''}">${a.g}</span><span class="sm num">${f2(a.sum)}${a.ci>0?'<span class="mu" title="в сумме есть предварительная компенсация Ci">*</span>':''}</span></button>`;
  if(o.open===a.n){
    h+=`<div class="det">${path(t,a.n).map(chipG).join('')}<span style="flex-basis:100%"></span>
      <button class="btn sm" data-act="follow" data-n="${esc(a.n)}">${me?'★ слежу - убрать':'☆ следить'}</button>
      ${a.ci>0?`<span class="mu" style="font-size:11px;align-self:center">* Ci ${f2(a.ci)} - предварительно, уточняется по ходу турнира</span>`:''}</div>`;
  }
  return h;
}
function tableHTML(t,o){
  const T=table(t),q=(o.q||'').toLowerCase(),lim=o.limit||999;let h='',n=0;o.gmax=T.rows.reduce((m,a)=>Math.max(m,a.g),0);
  h+=`<div class="thead"><span>#</span><span></span><span></span><span>игрок</span><span>${T.lg>=0?'игра '+(T.lg+1):''}</span><span title="сколько игр уже пошло в зачёт">игр</span><span>Σ</span></div>`;
  T.rows.forEach(a=>{
    if(q&&!a.n.toLowerCase().includes(q))return;
    if(n>=lim&&!o.follow.includes(a.n))return;n++;
    h+=rowHTML(t,a,o);
    if(!q&&a.pos===t.cut&&lim>t.cut&&T.rows.length>t.cut)h+=`<div class="cut">▲ ${esc(t.cutLabel)}</div>`;
  });
  return h;
}
function gstripHTML(t,sel){const c=curGame(t),fin=finished(t);
  return `<div class="gstrip">${t.games.map((g,i)=>`<button class="${i===sel?'on':''} ${g.tb.length&&g.tb.every(tPlayed)?'done':(!fin&&i===c?'cur':'')}" data-act="game" data-g="${i}" title="${esc(g.st)}">${isFinG(t,g)?'Ф':''}${i+1}</button>`).join('')}</div>`;}
/* карточка стола. o.detail - с допами (для ленты результатов) */
function tcardHTML(t,gi,tb,o){
  const x=strength(t,tb),c=curGame(t),going=!tb.w&&gi===c&&!finished(t),j=t.judges[tb.n],fin=isFinG(t,t.games[gi]);
  const sorted=tb.s.slice().sort((a,b)=>a[0]-b[0]);
  return `<div class="tcard${o.sel===tb.n&&o.selG===gi?' sel':''}">
    <div class="hd"><b>${fin?'Финальный стол':'Стол '+ROM[tb.n]}</b>${stHTML(x)}
      ${going?'<span class="tag go">идёт</span>':tb.w?`<span class="tag ${tb.w}">${winLab(tb.w)}</span>`:''}
      <span class="sp"></span>${j?`<span class="st">судья ${esc(j)}</span>`:''}
      ${o.noBtn?'':`<button class="btn sm${going&&!o.quiet?' pri':''}" data-act="air" data-id="${t.id}" data-tb="${tb.n}" data-g="${gi}">▶ ${tb.w?'запись':'эфир'}</button>`}</div>
    <div class="seats${o.detail?' one':''}" style="--sr:${Math.ceil(sorted.length/2)}">${sorted.map(s=>{const me=o.follow.includes(s[1]),r=ROLE[s[2]];
      const pts=tb.w&&r?(o.detail?`<span class="role ${r[1]}">${r[0]}</span>${s[7]?'<span title="убит первым" class="mu">✝</span>':''}<span class="dp num ${s[4]>0?'pos':s[4]<0?'neg':'mu'}" title="допы и штрафы${s[8]?', в том числе запись чёрных '+f2(s[8]):''}">${s[4]?sgn(s[4]):'·'}</span>${s[6]?`<span class="dp num mu" title="компенсация Ci">Ci ${f2(s[6])}</span>`:''}<span class="pt num ${s[3]>0?'pos':s[3]<0?'neg':'mu'}"><b>${sgn(s[3])}</b></span>`
        :`<span class="role ${r[1]}">${r[0]}</span><span class="pt num ${s[3]>0?'pos':s[3]<0?'neg':'mu'}">${sgn(s[3])}</span>`):`<span class="pt num mu">${(t.pl[s[1]]||[])[1]||''}</span>`;
      return `<div class="seat${me?' me':''}"><span class="sn num">${s[0]}</span>${av(t,s[1],20)}<span class="nm">${esc(s[1])}</span>${pts}</div>`;}).join('')}</div>
    ${o.detail?'<div class="note" style="padding:6px 10px">Колонки: роль · допы и штрафы · итог за игру (победа 0.75 + допы). ✝ - убит первым.</div>':''}</div>`;
}
function gameHTML(t,gi,o){return `<div style="display:grid;gap:10px">${t.games[gi].tb.map(tb=>tcardHTML(t,gi,tb,o)).join('')}</div>`;}
/* состав стола кружочками */
function circlesHTML(t,tb,follow){return `<span class="circ">${tb.s.slice().sort((a,b)=>a[0]-b[0]).map(s=>`<span class="${follow.includes(s[1])?'me':''}">${av(t,s[1],26)}</span>`).join('')}</span>`;}
</script>
<script>

if(!ID){const td=ymd(prg());const m=DB.find(x=>x.liveFrom&&td>=x.liveFrom&&td<=(x.liveTo||x.liveFrom))||DB.find(x=>x.status!=='finished')||DB[0];if(m)ID=String(m.id);}

function renderBar(){

let stageSig='';
function renderStage(){

  $('app').dataset.mode=S.mode;
  if(sig!==stageSig){stageSig=sig;
    if(all){$('vid').innerHTML=tbs.map(tb=>`<div class="cell video" data-cell="${tb.n}"><div class="lab"><button data-act="main" data-tb="${tb.n}">Стол ${ROM[tb.n]}<i class="snd" style="font-style:normal"></i></button><button data-act="air" data-tb="${tb.n}" data-g="${S.vg}" title="только этот стол">⤢</button></div>${playerHTML(t,tb.n,S.vg)}</div>`).join('');}
    else{$('vid').innerHTML=playerHTML(t,S.table,S.vg,{sound:true,cap:(isFinG(t,t.games[S.vg])?'Финальный стол':'Стол '+ROM[S.table])+' · игра '+(S.vg+1)})+(streamId(t,S.table,S.vg)&&ONSITE?`<div class="vctl">${liveBtn(false)}${sndBtn()}</div>`:'');}
  }
  {const big=S.lay==='big',k=.5625;let vf=k,off=150;if(all){off=205;vf=big?k*(1+1/Math.max(1,n-1)):Math.ceil(n/(n<=4?2:3))*k/(n<=4?2:3);}
    $('app').style.setProperty('--vf',vf.toFixed(4));$('app').style.setProperty('--off',off+'px');}
  if(all){
    const big=S.lay==='big',v=$('vid');v.className='multi'+(big?' big':'');
    v.style.setProperty('--c',big?Math.max(1,n-1):(n<=4?2:3));v.style.setProperty('--lc',n<=2?n:n<=4?2:3);
    v.querySelectorAll('.cell').forEach(c=>{const m=+c.dataset.cell===S.table;c.classList.toggle('main',m);const s=c.querySelector('.snd');if(s)s.textContent=m?(window.__snd?' · 🔊':' · 🔇 включить звук'):'';});
    $('allbar').innerHTML=`<div class="seg"><button data-act="lay" data-l="big" class="${S.lay==='big'?'on':''}">большой + остальные</button><button data-act="lay" data-l="grid" class="${S.lay==='grid'?'on':''}">сетка</button></div>${ONSITE?liveBtn(true):''}<span>Тап по названию стола - он главный и звук там; ещё тап - звук выключить. Поверни телефон - столы на весь экран.</span>`;
  }else{$('vid').className='video';$('allbar').innerHTML='';}
  $('minicap').innerHTML=`<b>Стол ${ROM[S.table]} · игра ${S.vg+1}</b><div class="mc"><button class="btn sm" data-act="mode" data-m="air">развернуть</button>${streamId(t,S.table,S.vg)&&ONSITE?sndBtn()+liveBtn(false):''}</div>`;
  const c=curGame(t);
  $('chips').innerHTML=tbs.length>1?tbs.map(tb=>{const x=strength(t,tb),fv=tb.s.filter(s=>S.follow.includes(s[1])).length;
    return `<button class="chip${tb.n===S.table?' on':''}" data-act="${all?'main':'air'}" data-tb="${tb.n}" data-g="${S.vg}">${!tb.w&&S.vg===c&&!finished(t)?'<i class="dot"></i>':''}${fv?`<i class="fav">★${fv>1?fv:''}</i>`:''}<b>${ROM[tb.n]}</b><small>${stBars(x)}<span style="color:${x.col}">${x.word}</span></small></button>`;}).join(''):'';
  $('chips').style.display=tbs.length>1?'':'none';
  const tb=tbs.find(x=>x.n===S.table)||tbs[0];
  $('under').innerHTML=tcardHTML(t,S.vg,tb,{follow:S.follow,noBtn:true});
}
function renderTabs(){const h=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-t="${k}">${l}${k==='my'&&S.follow.length?' · '+S.follow.length:''}</button>`).join('');$('tabsM').innerHTML=h;$('tabsD').innerHTML=h;
  TABS.forEach(([k])=>$('s-'+k).classList.toggle('on',S.tab===k));}
function stageNote(){const q=t.games.filter(g=>!isFinG(t,g)).length,f=t.gt-q;return f?`${q} игр квалификации, затем финал (${f})`:`место по сумме за ${t.gt} игр`;}
function renderTable(){
  const keep=document.activeElement&&document.activeElement.id==='q';
  $('s-table').innerHTML=`<h3>Таблица <span>сыграно игр: ${playedCount(t)} из ${t.gt}</span></h3><input class="q" id="q" placeholder="Найти игрока" value="${esc(S.q)}" autocomplete="off" style="margin-bottom:10px">
    <div class="tbl" id="tblbody">${tableHTML(t,{follow:S.follow,open:S.open,q:S.q})}</div>
    <div class="note">Колонка «игра ${lastGame(t)+1}» - балл за последнюю сыгранную игру, «игр» - сколько игр в зачёте (оранжевым - у кого пока меньше, чем у остальных: сравнивать с ними рано), стрелка - на сколько мест сдвинулся. Тап по игроку - все его игры. ${esc(stageNote())}. Неофициальный пересчёт по протоколам mafgame; * - в сумме есть предварительная компенсация Ci.</div>`;
  if(keep){const q=$('q');q.focus();q.setSelectionRange(q.value.length,q.value.length);}
}
function renderNow(){
  const c=curGame(t),g=S.g,lab=g===c&&!finished(t)?'идёт сейчас':g<c||finished(t)?'сыграна':'впереди';
  $('s-now').innerHTML=`<h3>Столы · игра ${g+1} <span>${lab}</span></h3>${gstripHTML(t,g)}${gameHTML(t,g,{follow:S.follow,sel:S.table,selG:S.vg})}
   <div class="note">Сила стола - по тирам MMR игроков относительно всех столов турнира: пустая линейка - спокойный, одна палка - мягкий, две - ровный, три - сильный, три красные - элитный. Рядом - средний MMR стола.</div>`;
}
function renderNext(){
  const c=curGame(t),from=finished(t)?t.gt:c+1,to=S.allNext?t.gt:Math.min(t.gt,from+3);let h='';
  for(let gi=from;gi<to;gi++){
    h+=`<div class="ng"><button class="gh" data-act="game" data-g="${gi}" data-go="1"><b style="white-space:nowrap">${isFinG(t,t.games[gi])?'Финал · ':''}Игра ${gi+1}</b><span class="k" style="white-space:nowrap">столы →</span></button>${t.games[gi].tb.map(tb=>{const x=strength(t,tb);
      return `<div class="ln"><div><b>Стол ${ROM[tb.n]}</b> ${stBars(x)}<span class="sw" style="color:${x.col}">${x.word}</span></div>${circlesHTML(t,tb,S.follow)}</div>`;}).join('')||'<div class="note">Рассадку этой игры mafgame ещё не опубликовал.</div>'}</div>`;}
  if(!h)h='<div class="note">Все игры сыграны.</div>';
  else if(to<t.gt)h+=`<button class="btn" style="width:100%" data-act="allnext">показать все оставшиеся игры (${t.gt-to})</button>`;
  $('s-next').innerHTML=`<h3>Дальше <span>${from<t.gt?'игры '+(from+1)+'-'+to:''}</span></h3>${h}${S.follow.length?'<div class="note">Твои игроки обведены. Кто есть кто - наведи или открой «Столы».</div>':'<div class="note">Кружочки - состав стола, цвет ободка - тир MMR. Кто есть кто - открой «Столы».</div>'}`;
}
function renderMy(){
  const T=table(t),c=curGame(t),fin=finished(t);
  const opts=Object.keys(t.pl).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${esc(n)}">`).join('');
  const byT={};S.follow.forEach(n=>{const w=whereIs(t,c,n);if(w&&!fin)(byT[w.tb]=byT[w.tb]||[]).push(n);});
  if(S.main&&!S.follow.includes(S.main))S.main='';
  let h=`<h3>Мои игроки <span>${S.follow.length} из 8</span></h3>${S.follow.length<8?`<input class="q" id="add" placeholder="Добавить игрока - начни вводить ник" autocomplete="off" autocapitalize="off"><div class="addl" id="addl"></div>`:'<div class="note">Уже 8 - чтобы добавить нового, убери кого-то (✕).</div>'}`;
  if(!S.follow.length)h+='<div class="note">Добавь себя или тех, за кого болеешь: место, балл за последнюю игру, где сидит сейчас и за какими столами дальше. Они подсветятся в таблице и на столах.</div>';
  if(S.main)h+=`<label class="auto"><input type="checkbox" id="auto" ${S.auto?'checked':''}> Эфир сам идёт за главным (${esc(S.main)})</label>`;else h+='<div style="height:8px"></div>';
  S.follow.forEach(n=>{const a=T.rows.find(x=>x.n===n);if(!a)return;const p=path(t,n),w=fin?null:whereIs(t,c,n),nx=p.find(x=>x.gi>c),mates=w?(byT[w.tb]||[]).filter(x=>x!==n):[];
    const strong=w?w.o.s.filter(s=>s[1]!==n&&/^[LSA]$/.test((t.pl[s[1]]||[])[1]||'')).map(s=>esc(s[1])+' ('+t.pl[s[1]][1]+')'):[];
    h+=`<div class="myr${S.openMy[n]?' open':''}" data-n="${esc(n)}"><div class="tp">${av(t,n,30)}<button class="nm" data-act="myopen" data-n="${esc(n)}" style="text-align:left"><b>${esc(n)}${S.main===n?' <span class="mu" style="font-weight:500;font-size:11px">· главный</span>':''}</b><small>${w?'стол '+ROM[w.tb]+' · место '+w.seat:fin?'турнир сыгран':'в этой игре не играет'}${mates.length?'<span class="tg2">вместе</span>':''}</small></button>
        <span class="pl">#${a.pos}<small>Σ ${f2(a.sum)} ${a.d>0?`<span class="up">▲${a.d}</span>`:a.d<0?`<span class="dn">▼${-a.d}</span>`:''}</small></span>
        ${w?`<button class="btn sm" data-act="air" data-tb="${w.tb}" data-g="${c}" aria-label="смотреть его стол">▶</button>`:''}<button class="chv" data-act="myopen" data-n="${esc(n)}" aria-label="подробнее">▾</button><button class="x" data-act="follow" data-n="${esc(n)}" aria-label="убрать" title="убрать">✕</button></div>
      <div class="dt">${a.last?`Последняя игра (${T.lg+1}): <b class="${a.last.v>0?'pos':a.last.v<0?'neg':''}">${sgn(a.last.v)}</b>. `:''}${nx?`Дальше: игра ${nx.gi+1}, стол ${ROM[nx.tb]}, место ${nx.seat}. `:''}${mates.length?'За этим столом ещё твои: '+mates.map(esc).join(', ')+'. ':''}${w?(strong.length?'Сильные за столом: '+strong.join(', ')+'.':'За столом нет игроков уровня A и выше.'):''}
        <div class="ch">${p.map(chipG).join('')}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${S.main===n?'':`<button class="btn sm" data-act="mainp" data-n="${esc(n)}">★ главный (эфир за ним)</button>`}<button class="btn sm" data-act="follow" data-n="${esc(n)}">убрать</button></div></div></div>`;});
  $('s-my').innerHTML=h;
}
function renderAll(){renderBar();renderStage();renderTabs();renderTable();renderNow();renderNext();renderMy();}
function save(){LSS(K+'mode',S.mode);LSS(K+'tab',S.tab);LSS(K+'follow',S.follow);LSS(K+'main',S.main);LSS(K+'auto',S.auto);}
function followMain(){if(!S.auto||!S.main||finished(t))return;const c=curGame(t),w=whereIs(t,c,S.main);if(w){S.vg=c;S.g=c;S.table=w.tb;}}

  else if(a==='game'){S.g=+b.dataset.g;if(b.dataset.go){S.tab='now';save();renderTabs();}renderNow();}

  else if(a==='mainp'){S.main=b.dataset.n;S.auto=true;save();followMain();renderAll();}
  else if(a==='follow'){const n=b.dataset.n,i=S.follow.indexOf(n);if(i>=0){S.follow.splice(i,1);if(S.main===n)S.main=S.follow[0]||'';}else if(S.follow.length<8)S.follow.push(n);if(!S.main&&S.follow.length)S.main=S.follow[0];save();renderAll();if(i<0&&b.closest('#addl')){const a2=$('add');if(a2)a2.focus();}}
  else if(a==='allnext'){S.allNext=true;renderNext();}
});
document.addEventListener('input',e=>{
  if(!S)return;
  if(e.target.id==='q'){S.q=e.target.value;$('tblbody').innerHTML=tableHTML(t,{follow:S.follow,open:S.open,q:S.q});}
  if(e.target.id==='add'){const q=e.target.value.trim().toLowerCase(),c=curGame(t);
    $('addl').innerHTML=q?Object.keys(t.pl).filter(n=>!S.follow.includes(n)&&n.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b)).slice(0,8).map(n=>{const w=whereIs(t,c,n);return `<button data-act="follow" data-n="${esc(n)}">${av(t,n,26)}<span>${esc(n)}</span><small>${w?'стол '+ROM[w.tb]:''}</small><b>＋</b></button>`;}).join('')||'<div class="note">никого не нашли</div>':'';}
});
document.addEventListener('change',e=>{if(S&&e.target.id==='auto'){S.auto=e.target.checked;save();if(S.auto){followMain();renderAll();}}});
(async function(){
  if(!ID){$('app').innerHTML='<div class="empty">Турнир не найден. <a href="live.html" style="color:var(--ac)">Live-центр</a></div>';return;}
  $('ttl').textContent='Загрузка…';
  try{t=await loadT(ID);}catch(e){t=null;}
  if(t&&!t.games.length){$('app').dataset.wait='1';$('ttl').textContent=t.short;const box=document.createElement('div');box.className='empty';box.id='waitbox';box.innerHTML='Загружаю протоколы mafgame…<br><small>mafgame сейчас отвечает медленно, это может занять до 30 секунд</small>';$('app').before(box);$('app').style.display='none';
    await refreshT(ID);$('waitbox').remove();$('app').style.display='';}
  if(t&&!t.games.length){const old=(DB.find(x=>String(x.id)===ID)||{}).watch;if(old&&old!=='watch2.html'){location.replace(old+'?old=1');return;}}
  if(!t||!t.games.length){$('app').innerHTML=`<div class="empty">${t?esc(t.name)+': рассадку и игры mafgame ещё не опубликовал.':'Турнир не найден.'}<br><br><a href="live.html" style="color:var(--ac)">Live-центр</a></div>`;if(t)$('ttl').textContent=t.short;return;}
  K='pw_'+ID+'_';stamp();const c=curGame(t);
  S={hide:LSG('pw_hide',false),lay:LSG('pw_lay',innerWidth<1000?'big':'grid'),mode:LSG(K+'mode','air'),tab:LSG(K+'tab','table'),table:+qs.get('tb')||1,g:c,vg:c,follow:LSG(K+'follow',[]),main:LSG(K+'main',''),auto:LSG(K+'auto',false),open:null,openMy:{},q:'',allNext:false};
  if(!['air','all','info'].includes(S.mode))S.mode='air';
  document.documentElement.style.setProperty('--acc',t.accent||'#ffce00');document.title=t.short+' · смотровая · DOVOD';
  if(!qs.get('tb'))followMain();
  const old=(DB.find(x=>String(x.id)===ID)||{}).watch;
  $('foot').innerHTML=`${esc(t.name)} · протоколы mafgame.org, обновляются сами раз в 20 секунд · MMR - mafiastats.com · эфиры - YouTube организаторов.${t.page?` <a href="${esc(t.page)}" style="color:var(--ac)">Страница турнира</a>.`:''}${old?` <a href="${esc(old)}?old=1" style="color:var(--mu);text-decoration:underline">Прежняя смотровая</a>.`:''}`;
  renderAll();
  if(t._cached)refreshT(ID).then(ch=>{stamp();if(ch){const c2=curGame(t);S.vg=c2;S.g=c2;followMain();renderAll();}});
  poll([ID],ch=>{if(ch){const c2=curGame(t);if(S.vg<c2&&S.g===S.vg){S.vg=c2;S.g=c2;}followMain();renderAll();}else renderBar();});
})();
