<script>/* DOVOD v2 core · общие данные и расчёты новой смотровой (watch2.html) и нового live-центра (live2.html) */
window.__liveSoft=1;window._autoref=1; /* без автоперезагрузки страницы - опрашиваем сами */
const ROM=['','I','II','III','IV','V','VI','VII','VIII'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DSH=new RegExp('\\s*['+String.fromCharCode(8212,8211)+']\\s*','g');const cln=s=>String(s==null?'':s).replace(DSH,' - ');
const f2=v=>(Math.round(v*100)/100).toFixed(2);
const sgn=v=>(v>0?'+':v<0?'-':'')+f2(Math.abs(v));
const LSG=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const LSS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const ONSITE=/^https?:/.test(location.protocol);
const ROLE={c:['мир','rc'],s:['шер','rs'],m:['маф','rm'],d:['дон','rd']};
const RC={Citizen:'c',Sheriff:'s',Mafia:'m',Don:'d'};

const DATA={t:{},snap:''};
const DB=(window.TOURNAMENTS_DB&&TOURNAMENTS_DB.tournaments)||[];
/* линия в таблице: финал топ-10 (по умолчанию), у турниров без финала - призы (как в live.html) */
const CUT={664:{n:3,lab:'призовые места'},757:{n:3,lab:'призовые места'}};
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function prg(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Prague'}));}
function stamp(){DATA.snap=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Prague'});}

/* ---------- загрузка турнира (тот же набор источников, что у live.html и смотровых) ---------- */
function adapt(games){return (games||[]).map(g=>({st:g.stage,tb:(g.tables||[]).map(tb=>({n:tb.table_num,w:{red_win:'r',black_win:'b'}[tb.winner]||null,
  s:(tb.seats||[]).filter(q=>q&&q.name).map(q=>[q.seat,q.name,RC[q.role]||'',+q.sigma||0,+q.aps||0,+q.wpts||0,+q.ci||0,+q.kf||0,+q.bmb||0])}))}));}
async function loadT(id){
  id=String(id);const m=DB.find(x=>String(x.id)===id)||{id};
  const J=(u,o)=>fetch(u,o).then(r=>r.ok?r.json():null).catch(()=>null);
  const [P,TJ,A]=await Promise.all([J('data/participants_'+id+'.json'),J('data/tournament_'+id+'.json',{cache:'no-store'}),J('data/avatars_'+id+'.json')]);
  const tj=TJ||{},avs=(A&&A.avatars)||{},pl={};
  ((P&&P.players)||[]).forEach(p=>{const mm=(p.ms&&p.ms.rating)||p.r_ms_mmr;pl[p.nick]=[mm?Math.round(mm):null,p.r_ms_tier||'',avs[p.nick]||p.av||'',p.flag||''];});
  try{const sj=await J('data/streams_'+id+'.json?cb='+Date.now(),{cache:'no-store'});if(sj&&sj.days){window.STREAMS_DB=window.STREAMS_DB||{};STREAMS_DB[id]=sj;}}catch(e){}
  if(window.DOVOD_SHEET){try{const ss=await DOVOD_SHEET.streams(id);if(ss&&ss.n){const b=Object.assign({gamesDay1:6,days:{}},(window.STREAMS_DB||{})[id]||{});b.days=JSON.parse(JSON.stringify(b.days||{}));
    Object.keys(ss.days).forEach(d=>{b.days[d]=Object.assign(b.days[d]||{},ss.days[d]);});if(ss.final)b.final=ss.final;b.test=false;window.STREAMS_DB=window.STREAMS_DB||{};STREAMS_DB[id]=b;}}catch(e){}}
  const c=CUT[id]||{n:10,lab:'выход в финал'};
  const a=tj.live_from||m.liveFrom||m.start,b=tj.live_to||m.liveTo||a,td=ymd(prg());
  const t=DATA.t[id]={id,name:cln(m.name||tj.tournament_name||('Турнир '+id)),short:cln(tj.short||m.name||('Турнир '+id)),city:m.city||'',country:m.country||'',stars:m.stars||0,np:m.players||Object.keys(pl).length,
    accent:m.accent||tj.accent||'#ffce00',color:m.accent||tj.accent||'#ffce00',page:m.page||'',prize:m.prize||'',judges:tj.referees_by_table||{},cut:c.n,cutLabel:c.lab,pl,games:[],gt:0,
    inWin:!!a&&td>=a&&td<=b,status:m.status||''};
  await refreshT(id);return t;
}
async function refreshT(id){const t=DATA.t[id];if(!t)return false;let G=null;try{G=window.loadGames?await window.loadGames(id):null;}catch(e){}
  if(!G||!G.games||!G.games.length)return false;const g=adapt(G.games),sig=JSON.stringify(g);if(sig===t._sig)return false;t._sig=sig;t.games=g;t.gt=g.length;t._ts=null;
  g.forEach(x=>x.tb.forEach(tb=>tb.s.forEach(s=>{if(!t.pl[s[1]])t.pl[s[1]]=[null,'','',''];})));return true;}
/* опрос: раз в 20 с, вкладка в фоне не опрашивает */
function poll(ids,cb){setInterval(async()=>{if(document.hidden)return;let ch=false;for(const id of ids){const t=DATA.t[id];if(t&&(t.inWin||!finished(t)))ch=(await refreshT(id))||ch;}stamp();cb(ch);},20000);
  document.addEventListener('visibilitychange',async()=>{if(document.hidden)return;let ch=false;for(const id of ids)ch=(await refreshT(id))||ch;stamp();cb(ch);});}
/* разные турниры - разные цвета: свой акцент, если он не сливается с уже занятыми, иначе следующий из запасных */
function hue(hex){const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 0;const n=parseInt(m[1],16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;
  let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;return h<0?h+360:h;}
function assignColors(ts){const spare=['#4cc9f0','#c77dff','#7ae582','#ff8fab','#ff9f1c','#9db4ff'],used=[];const far=(c)=>used.every(u=>{const d=Math.abs(hue(u)-hue(c));return Math.min(d,360-d)>=45;});
  ts.forEach(t=>{let c=t.accent;if(!far(c))c=spare.find(far)||spare[used.length%spare.length];t.color=c;used.push(c);});}

/* ---------- расчёты ---------- */
function tPlayed(tb){return !!tb.w;}
function isFinG(t,g){return !!g&&g.st==='Финал'&&t.games.some(x=>x.st!=='Финал');}
function curGame(t){for(let i=0;i<t.games.length;i++){if(!t.games[i].tb.every(tPlayed))return i;}return Math.max(0,t.games.length-1);}
function lastGame(t){let r=-1;t.games.forEach((g,i)=>{if(g.tb.some(tPlayed))r=i;});return r;}
function playedCount(t){return t.games.filter(g=>g.tb.length&&g.tb.every(tPlayed)).length;}
function finished(t){return t.games.length>0&&t.games.every(g=>g.tb.every(tPlayed));}
function standings(t,skip){
  const m={};
  t.games.forEach((g,gi)=>{if(gi===skip)return;g.tb.forEach(tb=>{if(!tb.w)return;tb.s.forEach(s=>{
    const a=m[s[1]]=m[s[1]]||{n:s[1],sum:0,g:0,w:0,ci:0};a.sum+=s[3];a.g++;a.ci+=s[6];if(s[5]>0)a.w++;});});});
  Object.keys(t.pl).forEach(n=>{if(!m[n])m[n]={n,sum:0,g:0,w:0,ci:0};});
  const arr=Object.values(m).sort((a,b)=>b.sum-a.sum||b.w-a.w||a.n.localeCompare(b.n));
  arr.forEach((a,i)=>a.pos=i+1);return arr;
}
function table(t){
  const lg=lastGame(t),now=standings(t),was=lg>0?standings(t,lg):null,wp={};
  if(was)was.forEach(a=>wp[a.n]=a.pos);
  const last={};
  if(lg>=0)t.games[lg].tb.forEach(tb=>{if(tb.w)tb.s.forEach(s=>last[s[1]]={v:s[3],r:s[2],tb:tb.n,win:s[5]>0});});
  now.forEach(a=>{a.d=was&&a.g?wp[a.n]-a.pos:0;a.last=last[a.n]||null;});
  return {rows:now,lg};
}
function path(t,n){const r=[];t.games.forEach((g,gi)=>g.tb.forEach(tb=>tb.s.forEach(s=>{if(s[1]===n)r.push({gi,tb:tb.n,seat:s[0],role:s[2],v:s[3],aps:s[4],win:s[5]>0,played:!!tb.w,kf:s[7],ci:s[6],w:tb.w,fin:isFinG(t,g)});})));return r;}
function whereIs(t,gi,n){const g=t.games[gi];if(!g)return null;for(const tb of g.tb){const s=tb.s.find(x=>x[1]===n);if(s)return {tb:tb.n,seat:s[0],o:tb};}return null;}
/* сила стола - метод сайта: очки по тирам MMR (L4 S3 A2 B1), категория - отклонение от всех столов этого турнира (как в live.html и на страницах турнира) */
const TPTS={L:4,S:3,A:2,B:1};
const SCAT=[['спокойный','#3fa7c4'],['мягкий','#6f93b4'],['ровный','#c9a74a'],['сильный','#e07a3c'],['элитный','#e0405a']];
function tpts(t,tb){return tb.s.reduce((a,s)=>a+(TPTS[(t.pl[s[1]]||[])[1]]||0),0);}
function tstat(t){if(t._ts)return t._ts;const v=[];t.games.forEach(g=>{if(isFinG(t,g))return;g.tb.forEach(tb=>{if(tb.s.length>=6)v.push(tpts(t,tb));});});
  const m=v.length?v.reduce((a,b)=>a+b,0)/v.length:0,sd=v.length>1?Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length-1)):0;return t._ts={m,sd};}
function strength(t,tb){const st=tstat(t);let lv=2;if(st.sd&&tb.s.length>=6){const z=(tpts(t,tb)-st.m)/st.sd;lv=z>=2?4:z>=1?3:z>-1?2:z>-2?1:0;}
  const ms=tb.s.map(s=>(t.pl[s[1]]||[])[0]).filter(Boolean);return {lv,word:SCAT[lv][0],col:SCAT[lv][1],mmr:ms.length?Math.round(ms.reduce((a,b)=>a+b,0)/ms.length):null};}
/* линейка: пусто - спокойный, 1 - мягкий, 2 - ровный, 3 - сильный, 3 красные - элитный */
function stBars(x){const n=x.lv===4?3:x.lv;return `<span class="sb${x.lv===4?' hot':''}" title="сила стола: ${x.word}${x.mmr?' · средний MMR '+x.mmr:''}">${[0,1,2].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;}
function stHTML(x,o){o=o||{};return `${stBars(x)}${o.word===false?'':`<span class="sw" style="color:${x.col}">${x.word}</span>`}${x.mmr&&o.mmr!==false?`<span class="st num">MMR ${x.mmr}</span>`:''}`;}
/* эфир стола: правила как в live.html - день по дате (dayDates), иначе по номеру игры; финал - отдельный эфир */
function SDB(id){return (window.STREAMS_DB&&STREAMS_DB[id])||null;}
function streamId(t,tb,gi){const st=SDB(t.id);if(!st)return null;const g=t.games[gi];if(isFinG(t,g))return st.final||null;
  let d=null;const c=curGame(t);
  if(gi===c||gi==null){const dd=st.dayDates,td=ymd(prg());if(dd)Object.keys(dd).forEach(k=>{if(td>=dd[k])d=k;});}
  if(!d){const q=t.games.slice(0,(gi==null?c:gi)+1).filter(x=>x.st!=='Финал').length;d=q<=(st.gamesDay1||6)?'1':'2';}
  return ((st.days||{})[d]||{})[String(tb)]||null;}
function playerHTML(t,tb,gi,opt){
  opt=opt||{};const id=streamId(t,tb,gi),lab=`Стол ${ROM[tb]||tb}`;
  if(!id)return `<div class="ph"><b>${esc(opt.cap||lab)}</b><span>эфир этого стола появится перед началом</span></div>`;
  if(/^url:/.test(id))return `<a class="ph" href="${esc(id.slice(4))}" target="_blank" rel="noopener"><em>▶</em><b>${esc(opt.cap||lab)}</b><span>эфир открывается на YouTube</span></a>`;
  if(!ONSITE)return `<a class="ph" href="https://www.youtube.com/watch?v=${esc(id)}" target="_blank" rel="noopener"><em>▶</em><b>${esc(opt.cap||lab)}</b><span>файл открыт с диска - эфир на YouTube</span></a>`;
  const base=/^live:/.test(id)?'https://www.youtube.com/embed/live_stream?channel='+encodeURIComponent(id.slice(5))+'&':'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?';
  return `<iframe data-tb="${tb}" data-k="${esc(t.id+'-'+tb)}" src="${base}autoplay=1&mute=${opt.sound&&window.__snd?0:1}&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" title="${esc(lab)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}
/* звук без перезагрузки плеера: команды YouTube через postMessage (как в текущих смотровых) */
function ytCmd(fr,func){try{fr.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*');}catch(e){}}
/* звук включается только после нажатия человека (иначе браузер не запустит эфир): до этого все плееры без звука */
window.__snd=false;
function sndBtn(){return `<button class="sndb${window.__snd?' on':''}" data-act="snd">${window.__snd?'🔊 звук':'🔇 включить звук'}</button>`;}
function soundTo(root,key){root.querySelectorAll('iframe[data-k]').forEach(fr=>ytCmd(fr,fr.dataset.k===key?'unMute':'mute'));}
function avMono(n){return esc(String(n).replace(/[^A-Za-zА-Яа-яЁё0-9]/g,'').slice(0,2).toUpperCase());}
function avErr(im){const s=document.createElement('span');s.className='av mono';s.title=im.title;s.style.cssText=im.style.cssText;s.textContent=String(im.title).replace(/[^A-Za-zА-Яа-яЁё0-9]/g,'').slice(0,2).toUpperCase();im.replaceWith(s);}
function av(t,n,sz){const p=t.pl[n]||[],c=TIERC[p[1]||'']||TIERC[''];sz=sz||26;const fs=sz<24?8:10;
  return p[2]?`<img class="av" loading="lazy" title="${esc(n)}" style="width:${sz}px;height:${sz}px;border-color:${c};font-size:${fs}px" src="${esc(p[2])}" alt="" onerror="avErr(this)">`
    :`<span class="av mono" title="${esc(n)}" style="width:${sz}px;height:${sz}px;border-color:${c};font-size:${fs}px">${avMono(n)}</span>`;}
function winLab(w){return w==='r'?'победа красных':w==='b'?'победа чёрных':'';}
function stars(n){return '★'.repeat(n||0);}
function feed(ts,lim){const r=[];ts.forEach(t=>t.games.forEach((g,gi)=>g.tb.forEach(tb=>{if(!tb.w)return;const best=tb.s.slice().sort((a,b)=>b[3]-a[3])[0];r.push({t,gi,tb:tb.n,o:tb,w:tb.w,best});})));
  return r.sort((a,b)=>b.gi-a.gi||a.tb-b.tb).slice(0,lim||8);}
/* короткая стата игрока в турнире */
function pstat(t,n){const p=path(t,n).filter(x=>x.played),T=table(t),a=T.rows.find(x=>x.n===n);const red=p.filter(x=>x.role==='c'||x.role==='s'),blk=p.filter(x=>x.role==='m'||x.role==='d');
  return {pos:a?a.pos:null,of:T.rows.length,d:a?a.d:0,sum:a?a.sum:0,g:p.length,w:p.filter(x=>x.win).length,rg:red.length,rw:red.filter(x=>x.win).length,bg:blk.length,bw:blk.filter(x=>x.win).length,
    aps:p.reduce((s,x)=>s+x.aps,0),kf:p.filter(x=>x.kf).length,last:a&&a.last};}

<script>/* общие блоки: таблица, столы игры, кружочки состава, строка «моего игрока» */
function mvHTML(d){return d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv dn">▼${-d}</span>`:`<span class="mv mu">·</span>`;}
function chipG(x){return x.played
  ?`<span class="gc ${x.win?'w':'l'}" title="игра ${x.gi+1} · стол ${ROM[x.tb]} · место ${x.seat}"><b>${x.fin?'Ф':'И'}${x.gi+1}</b><span class="mu">${ROM[x.tb]}</span><span class="role ${ROLE[x.role]?ROLE[x.role][1]:''}">${ROLE[x.role]?ROLE[x.role][0]:'?'}</span><span class="num ${x.v>0?'pos':x.v<0?'neg':'mu'}">${sgn(x.v)}</span>${x.kf?'<span title="убит первым">✝</span>':''}</span>`
  :`<span class="gc f" title="игра ${x.gi+1} · стол ${ROM[x.tb]} · место ${x.seat}"><b>${x.fin?'Ф':'И'}${x.gi+1}</b><span class="mu">${ROM[x.tb]} · м.${x.seat}</span></span>`;}
function rowHTML(t,a,o){
  const me=o.follow.includes(a.n),L=a.last;
  const lst=L?`<span class="lst num ${L.v>0?'pos':L.v<0?'neg':'mu'}" title="${L.win?'победа':'поражение'}, стол ${ROM[L.tb]}">${sgn(L.v)}</span>`:`<span class="lst mu"></span>`;
  let h=`<button class="row${a.pos<=t.cut?' pz':''}${me?' me':''}" data-act="open" data-n="${esc(a.n)}"><span class="ps num">${a.pos}</span>${mvHTML(a.d)}${av(t,a.n)}<span class="nm">${esc(a.n)}</span>${lst}<span class="sm num">${f2(a.sum)}${a.ci>0?'<span class="mu" title="в сумме есть предварительная компенсация Ci">*</span>':''}</span></button>`;
  if(o.open===a.n){
    h+=`<div class="det">${path(t,a.n).map(chipG).join('')}<span style="flex-basis:100%"></span>
      <button class="btn sm" data-act="follow" data-n="${esc(a.n)}">${me?'★ слежу - убрать':'☆ следить'}</button>
      ${a.ci>0?`<span class="mu" style="font-size:11px;align-self:center">* Ci ${f2(a.ci)} - предварительно, уточняется по ходу турнира</span>`:''}</div>`;
  }
  return h;
}
function tableHTML(t,o){
  const T=table(t),q=(o.q||'').toLowerCase(),lim=o.limit||999;let h='',n=0;
  h+=`<div class="thead"><span>#</span><span></span><span></span><span>игрок</span><span>${T.lg>=0?'игра '+(T.lg+1):''}</span><span>Σ</span></div>`;
  T.rows.forEach(a=>{
    if(q&&!a.n.toLowerCase().includes(q))return;
    if(n>=lim&&!o.follow.includes(a.n))return;n++;
    h+=rowHTML(t,a,o);
    if(!q&&a.pos===t.cut&&lim>t.cut&&T.rows.length>t.cut)h+=`<div class="cut">▲ ${esc(t.cutLabel)}</div>`;
  });
  return h;
}
function gstripHTML(t,sel){const c=curGame(t),fin=finished(t);
  return `<div class="gstrip">${t.games.map((g,i)=>`<button class="${i===sel?'on':''} ${g.tb.length&&g.tb.every(tPlayed)?'done':(!fin&&i===c?'cur':'')}" data-act="game" data-g="${i}" title="${esc(g.st)}">${isFinG(t,g)?'Ф':''}${i+1}</button>`).join('')}</div>`;}
/* карточка стола. o.detail - с допами (для ленты результатов) */
function tcardHTML(t,gi,tb,o){
  const x=strength(t,tb),c=curGame(t),going=!tb.w&&gi===c&&!finished(t),j=t.judges[tb.n],fin=isFinG(t,t.games[gi]);
  const sorted=tb.s.slice().sort((a,b)=>a[0]-b[0]);
  return `<div class="tcard${o.sel===tb.n&&o.selG===gi?' sel':''}">
    <div class="hd"><b>${fin?'Финальный стол':'Стол '+ROM[tb.n]}</b>${stHTML(x)}
      ${going?'<span class="tag go">идёт</span>':tb.w?`<span class="tag ${tb.w}">${winLab(tb.w)}</span>`:''}
      <span class="sp"></span>${j?`<span class="st">судья ${esc(j)}</span>`:''}
      ${o.noBtn?'':`<button class="btn sm${going&&!o.quiet?' pri':''}" data-act="air" data-id="${t.id}" data-tb="${tb.n}" data-g="${gi}">▶ ${tb.w?'запись':'эфир'}</button>`}</div>
    <div class="seats${o.detail?' one':''}">${sorted.map(s=>{const me=o.follow.includes(s[1]),r=ROLE[s[2]];
      const pts=tb.w&&r?(o.detail?`<span class="role ${r[1]}">${r[0]}</span>${s[7]?'<span title="убит первым" class="mu">✝</span>':''}<span class="dp num ${s[4]>0?'pos':s[4]<0?'neg':'mu'}" title="допы и штрафы${s[8]?', в том числе запись чёрных '+f2(s[8]):''}">${s[4]?sgn(s[4]):'·'}</span>${s[6]?`<span class="dp num mu" title="компенсация Ci">Ci ${f2(s[6])}</span>`:''}<span class="pt num ${s[3]>0?'pos':s[3]<0?'neg':'mu'}"><b>${sgn(s[3])}</b></span>`
        :`<span class="role ${r[1]}">${r[0]}</span><span class="pt num ${s[3]>0?'pos':s[3]<0?'neg':'mu'}">${sgn(s[3])}</span>`):`<span class="pt num mu">${(t.pl[s[1]]||[])[1]||''}</span>`;
      return `<div class="seat${me?' me':''}"><span class="sn num">${s[0]}</span>${av(t,s[1],20)}<span class="nm">${esc(s[1])}</span>${pts}</div>`;}).join('')}</div>
    ${o.detail?'<div class="note" style="padding:6px 10px">Колонки: роль · допы и штрафы · итог за игру (победа 0.75 + допы). ✝ - убит первым.</div>':''}</div>`;
}
function gameHTML(t,gi,o){return `<div style="display:grid;gap:10px">${t.games[gi].tb.map(tb=>tcardHTML(t,gi,tb,o)).join('')}</div>`;}
/* состав стола кружочками */
function circlesHTML(t,tb,follow){return `<span class="circ">${tb.s.slice().sort((a,b)=>a[0]-b[0]).map(s=>`<span class="${follow.includes(s[1])?'me':''}">${av(t,s[1],26)}</span>`).join('')}</span>`;}

<script>
const $=id=>document.getElementById(id),WIDE=()=>innerWidth>=860,MAXW=4,MAXMY=8;
const Q=new URLSearchParams(location.search),FORCE=(Q.get('ids')||'').split(',').filter(Boolean);
const TODAY=ymd(prg()),LIM=ymd(new Date(prg().getTime()+3*864e5));
const LIST=DB.filter(t=>FORCE.length?FORCE.includes(String(t.id)):(t.status!=='finished'&&t.start&&t.start<=LIM&&(t.liveTo||t.start)>=TODAY))
  .sort((a,b)=>String(a.start).localeCompare(String(b.start))||(b.stars||0)-(a.stars||0));
let TS=[];
const SSG=(k,d)=>{try{const v=sessionStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},SSS=(k,v)=>{try{sessionStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const L={sel:SSG('l2_sel',null),rt:LSG('l2_rt','table'),rid:null,my:LSG('l2_my',[]),wins:SSG('l2_wins','one'),multi:SSG('l2_multi',[]),snd:null,open:null,g:{},fd:null,stat:false};
const WATCH=(id,tb)=>`watch2.html?id=${id}${tb?'&tb='+tb:''}`;
const key=x=>x.id+'-'+x.tb;
function liveTables(){const r=[];TS.forEach(t=>{if(finished(t)||!t.games.length)return;const c=curGame(t);t.games[c].tb.forEach(tb=>{if(!tb.w)r.push({id:t.id,tb:tb.n});});});return r;}
function myWhere(n){const r=[];TS.forEach(t=>{if(!t.pl[n])return;const c=curGame(t),w=finished(t)?null:whereIs(t,c,n);r.push({t,w});});return r;}
function validMulti(){L.multi=L.multi.filter(x=>DATA.t[x.id]&&DATA.t[x.id].games.length&&DATA.t[x.id].games[curGame(DATA.t[x.id])].tb.some(q=>q.n===x.tb)).slice(0,MAXW);}

function renderBar(){
  const lt=liveTables(),n=TS.filter(t=>!finished(t)&&t.games.length).length;
  $('cnt').textContent=`${n} ${n===1?'турнир':n>1&&n<5?'турнира':'турниров'} · ${lt.length} ${lt.length===1?'стол':lt.length>1&&lt.length<5?'стола':'столов'} в игре · обновлено ${DATA.snap}`;
  document.querySelectorAll('#wins button').forEach(b=>b.classList.toggle('on',b.dataset.w===L.wins));
  const all=new Set();TS.forEach(t=>Object.keys(t.pl).forEach(n=>all.add(n)));
  $('pls').innerHTML=[...all].filter(n=>!L.my.includes(n)).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${esc(n)}">`).join('');
}
/* сцена: в режиме «несколько» окна добавляются и убираются по одному, остальные эфиры не перезагружаются */
let stMode='';
function renderStage(){
  const el=$('stage');
  if(L.wins==='multi'){
    validMulti();
    if(stMode!=='multi'){stMode='multi';el.innerHTML='<div class="multi" id="mw"></div><div class="scap"><div class="tx"><span id="mhint"></span></div></div>';}
    const mw=$('mw'),want=L.multi.map(key);
    [...mw.querySelectorAll('.cell')].forEach(c=>{if(!want.includes(c.dataset.k))c.remove();});
    L.multi.forEach(x=>{if(mw.querySelector(`.cell[data-k="${key(x)}"]`))return;const t=DATA.t[x.id];
      const d=document.createElement('div');d.className='cell video';d.dataset.k=key(x);d.style.setProperty('--a',t.color);
      d.innerHTML=`<div class="lab"><span class="nm"><i class="dot" style="--a:${t.color}"></i>${esc(t.city||t.short)} · стол ${ROM[x.tb]}</span><button data-act="msnd" data-k="${key(x)}">звук</button><span class="sp"></span><a href="${WATCH(x.id,x.tb)}" title="открыть в смотровой">⤢</a><button data-act="mrm" data-k="${key(x)}" title="убрать окно">✕</button></div>${playerHTML(t,x.tb,curGame(t),{cap:(t.city||t.short)+' · стол '+ROM[x.tb]})}`;
      mw.appendChild(d);});
    const add=mw.querySelector('.add');if(add)add.remove();
    if(L.multi.length<MAXW){const a=document.createElement('div');a.className='add';a.innerHTML=L.multi.length?`＋ ещё ${MAXW-L.multi.length}: нажми «＋» у стола в списке турниров`:'Набери свои эфиры: нажми «＋» у нужных столов в списке турниров (до 4)';mw.appendChild(a);}
    const n=mw.children.length;mw.style.setProperty('--c',n<=1?1:2);
    mw.querySelectorAll('.cell').forEach(c=>{c.classList.toggle('snd',c.dataset.k===L.snd);const b=c.querySelector('[data-act=msnd]');if(b)b.textContent=c.dataset.k===L.snd?'🔊 звук здесь':'звук';});
    $('mhint').textContent=`Окон: ${L.multi.length} из ${MAXW}. «＋» у стола в списке - добавить, «✕» на окне - убрать, «звук» - слушать этот стол.`;
    return;}
  if(!L.sel||!DATA.t[L.sel.id]||!DATA.t[L.sel.id].games.length){stMode='';el.innerHTML='';return;}
  const t=DATA.t[L.sel.id],c=curGame(t),tb=t.games[c].tb.find(x=>x.n===L.sel.tb)||t.games[c].tb[0],sig='one|'+t.id+'|'+tb.n;
  const mine=tb.s.filter(s=>L.my.includes(s[1])).map(s=>s[1]);
  const cap=`<div class="scap" style="--a:${t.color}"><div class="tx"><b><i class="dot"></i>${esc(t.short)} · стол ${ROM[tb.n]}</b><span>игра ${c+1} из ${t.gt}${mine.length?' · здесь ★ '+mine.map(esc).join(', '):''}</span></div><a class="btn sm go" href="${WATCH(t.id,tb.n)}">Смотровая →</a><button class="btn sm only-m" data-act="close" title="закрыть эфир">✕</button></div>`;
  if(sig!==stMode){stMode=sig;el.innerHTML=`<div class="video">${playerHTML(t,tb.n,c,{sound:true,cap:(t.city||t.short)+' · стол '+ROM[tb.n]})}${streamId(t,tb.n,c)&&ONSITE?sndBtn():''}</div><div id="scapw">${cap}</div>`;}
  else $('scapw').innerHTML=cap;
}
function tcHTML(t){
  if(!t.games.length)return `<div class="tc" style="--a:${esc(t.color)}"><div class="th"><span class="l1"><span class="ct">${esc(t.city)}</span><span>${stars(t.stars)}</span></span><b>${esc(t.short)}</b><span class="l2">рассадку mafgame ещё не опубликовал</span></div></div>`;
  const c=curGame(t),T=table(t),fin=finished(t),multi=L.wins==='multi';
  const mine=L.my.filter(n=>t.pl[n]).map(n=>T.rows.find(a=>a.n===n)).filter(a=>a&&a.pos>3);
  return `<div class="tc${L.rid===t.id?' sel':''}" style="--a:${esc(t.color)}">
    <button class="th" data-act="pick" data-id="${t.id}"><span class="l1">${fin?'<span>завершён</span>':t.inWin?'<span class="live">LIVE</span>':'<span>скоро</span>'}<span class="ct">${esc(t.city)}</span><span>${stars(t.stars)}</span></span>
      <b>${esc(t.short)}</b><span class="l2">${isFinG(t,t.games[c])?'финал · ':''}игра ${c+1} из ${t.gt} · ${t.np} игроков${t.prize?' · фонд '+esc(t.prize):''}</span></button>
    <div class="lead">${T.rows.slice(0,3).map(a=>`<span><i>${a.pos}.</i> ${esc(a.n)} <span class="num">${f2(a.sum)}</span></span>`).join('')}${mine.map(a=>`<span style="color:var(--ac)"><i>${a.pos}.</i> ★ ${esc(a.n)} <span class="num">${f2(a.sum)}</span></span>`).join('')}</div>
    ${t.games[c].tb.map(tb=>{const x=strength(t,tb),k=t.id+'-'+tb.n,inM=L.multi.some(q=>key(q)===k),on=multi?inM:(L.sel&&L.sel.id===t.id&&L.sel.tb===tb.n),fv=tb.s.filter(s=>L.my.includes(s[1])).map(s=>s[1]);
      return `<button class="tr${on?' on':''}" data-act="${multi?'mtog':'air'}" data-id="${t.id}" data-tb="${tb.n}"><b>Стол ${ROM[tb.n]}</b><span class="mid">${stBars(x)} <span style="color:${x.col}">${x.word}</span>${x.mmr?' · <span class="num">'+x.mmr+'</span>':''}${fv.length?` · <em>★ ${fv.map(esc).join(', ')}</em>`:''}${tb.w?' · '+winLab(tb.w):''}</span><span class="pl">${multi?(inM?'✓ в эфире':'＋'):'▶'}</span></button>`;}).join('')}
    <div class="ft"><button class="btn sm" data-act="pick" data-id="${t.id}" data-scroll="1">Таблица и столы</button><a class="btn sm go" href="${WATCH(t.id)}">Смотровая →</a></div></div>`;
}
function myHTML(){
  if(!L.my.length)return '';
  const rows=L.my.map(n=>{const ws=myWhere(n);if(!ws.length)return `<div class="myl"><span></span><span class="nm"><b>${esc(n)}</b><small>сейчас не играет</small></span><span></span><span></span><button class="x" data-act="myrm" data-n="${esc(n)}">✕</button></div>`;
    return ws.map(({t,w})=>{const s=pstat(t,n);return `<div class="myl" style="--a:${t.color}">${av(t,n,28)}<span class="nm"><b>${esc(n)}</b><small><i class="dot"></i>${esc(t.city||t.short)}${w?' · стол '+ROM[w.tb]+' · место '+w.seat:''}</small></span>
      <span class="pp">#${s.pos||'-'}<small>Σ ${f2(s.sum)} ${s.d>0?`<span class="up">▲${s.d}</span>`:s.d<0?`<span class="dn">▼${-s.d}</span>`:''}</small></span>
      ${w?`<button class="btn sm" data-act="${L.wins==='multi'?'mtog':'air'}" data-id="${t.id}" data-tb="${w.tb}" title="его стол">${L.wins==='multi'?(L.multi.some(q=>key(q)===t.id+'-'+w.tb)?'✓':'＋'):'▶'}</button>`:'<span></span>'}<button class="x" data-act="myrm" data-n="${esc(n)}" title="убрать">✕</button></div>`;}).join('');}).join('');
  return `<div class="h"><span>★ Мои игроки · ${L.my.length} из ${MAXMY}</span><button class="btn sm" data-act="stat">Стата моих</button></div><div class="myb">${rows}</div>`;
}
function statHTML(){
  const rows=[];L.my.forEach(n=>myWhere(n).forEach(({t,w})=>rows.push({n,t,w,s:pstat(t,n)})));
  const pc=(a,b)=>b?`${a}/${b}`:'·';
  return `<div class="ovl" data-act="statx"><div class="box" onclick="event.stopPropagation()"><div class="bh"><b>Стата моих игроков</b><button class="btn sm" data-act="statx">закрыть</button></div>
   <div class="sttw"><table class="stt"><tr><th>игрок · турнир</th><th>место</th><th>Σ</th><th>игр</th><th>побед</th><th title="за красных: побед / игр">красн.</th><th title="за чёрных: побед / игр">чёрн.</th><th title="сумма допов и штрафов">допы</th><th title="средний доп за игру">ср. доп</th><th title="сколько раз убит первым">✝</th><th>посл. игра</th><th>сейчас</th></tr>
   ${rows.map(r=>{const s=r.s;return `<tr><td><b>${esc(r.n)}</b><div class="tt"><i class="dot" style="--a:${r.t.color}"></i>${esc(r.t.short)}</div></td><td><b>${s.pos||'-'}</b> <span class="tt">из ${s.of}</span> ${s.d>0?`<span class="up">▲${s.d}</span>`:s.d<0?`<span class="dn">▼${-s.d}</span>`:''}</td><td class="num"><b>${f2(s.sum)}</b></td><td class="num">${s.g}</td><td class="num">${pc(s.w,s.g)}</td><td class="num">${pc(s.rw,s.rg)}</td><td class="num">${pc(s.bw,s.bg)}</td><td class="num ${s.aps>0?'pos':s.aps<0?'neg':''}">${s.g?sgn(s.aps):'·'}</td><td class="num">${s.g?sgn(s.aps/s.g):'·'}</td><td class="num">${s.kf||'·'}</td><td class="num ${s.last?(s.last.v>0?'pos':s.last.v<0?'neg':''):''}">${s.last?sgn(s.last.v):'·'}</td><td>${r.w?`<a href="${WATCH(r.t.id,r.w.tb)}" style="color:var(--ac)">стол ${ROM[r.w.tb]} →</a>`:'·'}</td></tr>`;}).join('')||'<tr><td colspan="12" class="tt">Никто из выбранных сейчас не играет в идущих турнирах.</td></tr>'}</table></div>
   <div class="note">Только турниры, которые идут сейчас. Побед - побед / игр; красн. и чёрн. - то же по командам; допы - сумма допов и штрафов без баллов за победу. Подробнее по игроку - в смотровой его турнира.</div></div></div>`;
}
function renderLeft(){
  const live=TS.filter(t=>!finished(t)),done=TS.filter(finished);
  const soon=DB.filter(x=>x.status!=='finished'&&!TS.some(t=>t.id===String(x.id))).sort((a,b)=>String(a.start||'9').localeCompare(String(b.start||'9'))).slice(0,4);
  $('left').innerHTML=`${myHTML()}<div class="h"><span>Сейчас идут</span><span>${live.length}</span></div>${live.map(tcHTML).join('')||'<div class="note">Сейчас турниров нет. Ближайшие - ниже.</div>'}${done.map(tcHTML).join('')}
   ${soon.length?`<div class="h"><span>Дальше в календаре</span></div><div class="card">${soon.map(x=>`<a class="up-c" style="--a:${esc(x.accent||'#444')}" href="${esc(x.page||'#')}"><b>${esc(cln(x.name))}</b><span class="d">${esc(cln(x.dates))}</span><span>${esc(x.city)} · ${stars(x.stars)} · ${x.players||''} игроков</span></a>`).join('')}</div>`:''}`;
}
function renderCenter(){
  const f=feed(TS,10),done=DB.filter(x=>x.status==='finished').slice(0,2);
  $('cbody').innerHTML=`<div class="h"><span>Лента результатов</span><span>нажми на строку - состав и баллы</span></div><div class="card" style="overflow:hidden">${f.map(x=>{const k=x.t.id+'-'+x.gi+'-'+x.tb,op=L.fd===k;
    return `<button class="fd${op?' open':''}" style="--a:${x.t.color}" data-act="fd" data-k="${k}"><span><i class="dot"></i><span class="ct">${esc(x.t.city||x.t.short)}</span> · игра ${x.gi+1} · стол ${ROM[x.tb]}</span><span class="tag ${x.w}">${winLab(x.w)}</span><span class="bst">лучший: ${esc(x.best[1])} <span class="num pos">${sgn(x.best[3])}</span> <span class="chv">${op?'▴':'▾'}</span></span></button>${op?`<div class="fdd">${tcardHTML(x.t,x.gi,x.o,{follow:L.my,detail:true,noBtn:true})}</div>`:''}`;}).join('')||'<div class="note">Пока нет сыгранных столов.</div>'}</div>
   ${done.length?`<div class="h"><span>Недавно завершились</span></div><div class="card">${done.map(x=>`<a class="up-c" style="--a:${esc(x.accent||'#444')}" href="${esc(x.page||'#')}"><b>${esc(cln(x.name))}</b><span class="d">${esc(cln(x.dates))}</span><span>${esc(x.city)} · ${stars(x.stars)}</span></a>`).join('')}</div>`:''}`;
}
function renderRight(){
  const t=DATA.t[L.rid];if(!t||!t.games.length){$('right').innerHTML='';return;}
  const g=Math.min(L.g[t.id]==null?curGame(t):L.g[t.id],t.gt-1),o={follow:L.my,open:L.open,limit:WIDE()?999:10};
  $('right').innerHTML=`<div class="card rp" id="rp" style="--a:${esc(t.color)}"><div class="hd"><b>${esc(t.short)}</b><a class="btn sm go" href="${WATCH(t.id)}">Смотровая →</a></div>
    <div class="tabs"><button class="${L.rt==='table'?'on':''}" data-act="rt" data-t="table">Таблица</button><button class="${L.rt==='now'?'on':''}" data-act="rt" data-t="now">Столы</button></div>
    <div class="bd">${L.rt==='table'?tableHTML(t,o)+`${WIDE()?'':`<a class="btn" style="margin:10px;display:flex" href="${WATCH(t.id)}">Вся таблица - в смотровой →</a>`}<div class="note">Балл за последнюю игру и сдвиг мест. Тап - игры игрока. Неофициальный пересчёт по протоколам; * - с предварительной Ci.</div>`
      :`<div class="pad">${gstripHTML(t,g)}${gameHTML(t,g,{follow:L.my,quiet:true,sel:L.sel&&L.sel.id===t.id?L.sel.tb:0,selG:curGame(t)})}</div>`}</div></div>`;
}
function renderAll(){renderBar();renderStage();renderLeft();renderCenter();renderRight();$('ovl').innerHTML=L.stat?statHTML():'';}
function saveS(){SSS('l2_sel',L.sel);SSS('l2_wins',L.wins);SSS('l2_multi',L.multi);LSS('l2_my',L.my);}
document.addEventListener('click',e=>{
  const w=e.target.closest('#wins button');
  if(w){L.wins=w.dataset.w;if(L.wins==='multi'&&!L.multi.length){const lt=liveTables(),mine=lt.filter(x=>DATA.t[x.id].games[curGame(DATA.t[x.id])].tb.find(q=>q.n===x.tb).s.some(s=>L.my.includes(s[1])));
      L.multi=(mine.length?mine:(L.sel?[L.sel]:lt.slice(0,1))).slice(0,MAXW).map(x=>({id:x.id,tb:x.tb}));}
    saveS();renderAll();return;}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='air'){const id=b.dataset.id||L.rid,g=b.dataset.g!=null?+b.dataset.g:curGame(DATA.t[id]);
    if(g!==curGame(DATA.t[id])){location.href=WATCH(id,b.dataset.tb);return;}
    if(L.wins==='multi'){const k=id+'-'+b.dataset.tb,i=L.multi.findIndex(q=>key(q)===k);if(i<0&&L.multi.length<MAXW)L.multi.push({id,tb:+b.dataset.tb});L.rid=id;saveS();renderAll();return;}
    L.sel={id,tb:+b.dataset.tb};L.rid=id;saveS();renderAll();if(!WIDE())window.scrollTo({top:0,behavior:'smooth'});}
  else if(a==='mtog'){const k=b.dataset.id+'-'+b.dataset.tb,i=L.multi.findIndex(q=>key(q)===k);if(i>=0){L.multi.splice(i,1);if(L.snd===k)L.snd=null;}else if(L.multi.length<MAXW)L.multi.push({id:b.dataset.id,tb:+b.dataset.tb});else{const h=$('mhint');if(h)h.textContent='Уже 4 окна - сначала убери одно («✕» на окне).';return;}
    L.rid=b.dataset.id;saveS();renderAll();}
  else if(a==='mrm'){L.multi=L.multi.filter(q=>key(q)!==b.dataset.k);if(L.snd===b.dataset.k)L.snd=null;saveS();renderAll();}
  else if(a==='msnd'){L.snd=L.snd===b.dataset.k?null:b.dataset.k;soundTo($('stage'),L.snd||'-');renderStage();}
  else if(a==='snd'){window.__snd=!window.__snd;soundTo($('stage'),window.__snd&&L.sel?L.sel.id+'-'+L.sel.tb:'-');const o=$('stage').querySelector('.sndb');if(o)o.outerHTML=sndBtn();}
  else if(a==='pick'){L.rid=b.dataset.id;L.open=null;renderLeft();renderRight();if(b.dataset.scroll&&!WIDE()&&$('rp'))$('rp').scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='rt'){L.rt=b.dataset.t;LSS('l2_rt',L.rt);renderRight();}
  else if(a==='game'){L.g[L.rid]=+b.dataset.g;renderRight();}
  else if(a==='open'){L.open=L.open===b.dataset.n?null:b.dataset.n;const bd=document.querySelector('#rp .bd'),st=bd?bd.scrollTop:0;renderRight();const b2=document.querySelector('#rp .bd');if(b2)b2.scrollTop=st;}
  else if(a==='follow'){const n=b.dataset.n,i=L.my.indexOf(n);if(i>=0)L.my.splice(i,1);else if(L.my.length<MAXMY)L.my.push(n);saveS();renderAll();}
  else if(a==='myrm'){L.my=L.my.filter(x=>x!==b.dataset.n);saveS();renderAll();}
  else if(a==='fd'){L.fd=L.fd===b.dataset.k?null:b.dataset.k;renderCenter();}
  else if(a==='stat'){L.stat=true;$('ovl').innerHTML=statHTML();}
  else if(a==='statx'){L.stat=false;$('ovl').innerHTML='';}
  else if(a==='close'){L.sel=null;saveS();renderAll();}
});
$('my').addEventListener('input',e=>{const v=e.target.value.trim();if(v&&TS.some(t=>t.pl[v])&&!L.my.includes(v)&&L.my.length<MAXMY){L.my.push(v);e.target.value='';saveS();const t=TS.find(t=>t.pl[v]);if(t)L.rid=t.id;renderAll();}});
let rsT=0;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{renderCenter();renderRight();},150);});
(async function(){
  stamp();
  const res=await Promise.all(LIST.map(m=>loadT(m.id).catch(()=>null)));TS=res.filter(Boolean);assignColors(TS);
  if(typeof L.my==='string')L.my=L.my?[L.my]:[];
  L.rid=(L.sel&&DATA.t[L.sel.id]?L.sel.id:null)||(TS.find(t=>t.games.length&&!finished(t))||TS[0]||{}).id||null;
  if(L.sel&&!DATA.t[L.sel.id])L.sel=null;
  if(WIDE()&&!L.sel){const lt=liveTables();if(lt.length)L.sel=lt[0];}
  $('foot').innerHTML='Результаты - протоколы mafgame.org, обновляются сами раз в 20 секунд. MMR - mafiastats.com. Эфиры - YouTube организаторов. Подробно по каждому турниру - его смотровая. <a href="live.html" style="color:var(--mu);text-decoration:underline">Прежний live-центр</a>.';
  renderAll();
  poll(TS.map(t=>t.id),ch=>{if(ch)renderAll();else renderBar();});
})();
</script></body></html>
