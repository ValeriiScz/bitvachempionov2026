# Еженедельное обновление данных сайта DOVOD из mafgame.org.
# Работает на серверах GitHub: мак и Claude не нужны. Vercel выкатывает сайт по коммиту.
# Расписание: 26.10.2026 — КАЖДЫЙ ЧАС в :07 (было раз в сутки, 22:00 UTC): календарь, отмены и заявки не ждут ночи.
# Прогон ~1 мин; коммит — только если что-то изменилось (репозиторий публичный, минуты Actions бесплатны).
# Запустить вручную: вкладка Actions → «Обновление данных mafgame» → Run workflow.
name: Обновление данных mafgame

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  # правка самого робота запускает прогон — так его можно проверить без ожидания воскресенья
  push:
    paths:
      - '.github/workflows/refresh-data.yml'
      - '.github/scripts/refresh_mafgame.py'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Выгрузить и обновить данные
        run: python .github/scripts/refresh_mafgame.py

      - name: Проверить, что датасет цел
        run: |
          python - <<'PY'
          import io,json,re,sys
          s=io.open('calendar.html',encoding='utf-8').read()
          i=s.find('const D=');j=s.find('};',i)
          D=json.loads(s[i+8:j+1])
          n=len(D['tournaments'])
          assert n>=300, 'турниров всего %d' % n
          assert D['snapshot'], 'нет даты снимка'
          se=io.open('data/season.js',encoding='utf-8').read()
          k=se.find('{'); S=json.loads(se[k:se.rfind('}')+1])
          assert len(S['rows'])>=300, 'в сводке строк %d' % len(S['rows'])
          assert re.search(r"const CACHE_VERSION = 'dovod-v\d+';", io.open('sw.js',encoding='utf-8').read())
          print('датасет цел: турниров', n, 'снимок', D['snapshot'])
          PY

      - name: Закоммитить, если что-то изменилось
        # 17.10.2026: прогон упал на push — пока он считал, в main успел уйти другой коммит (non-fast-forward).
        # Теперь при отказе встаём на свежий origin/main и ПЕРЕСЧИТЫВАЕМ данные заново (скрипт идемпотентный),
        # а не копируем старые файлы поверх — так не затираем чужие правки calendar.html и sw.js. До 3 попыток.
        run: |
          git config user.name  "dovod-bot"
          git config user.email "noreply@dovod-mafia.com"
          for i in 1 2 3; do
            if [ $i -gt 1 ]; then
              git fetch origin main && git reset --hard origin/main
              python .github/scripts/refresh_mafgame.py || exit 1
            fi
            if git diff --quiet; then echo "изменений нет — коммит не нужен"; exit 0; fi
            git add calendar.html data/season.js data/meta.js sw.js
            git commit -m "данные mafgame: автообновление $(date +%d.%m.%Y)"
            if git push origin HEAD:main; then echo "обновление выкачено (попытка $i)"; exit 0; fi
            echo "push отклонён — main ушёл вперёд, пересчитываю на свежем"; sleep 5
          done
          echo "::error::не удалось запушить после 3 попыток"; exit 1
