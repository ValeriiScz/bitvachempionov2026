# Еженедельный пересбор «Гонки за золотую дюжину» и «Серийников» (dovod-mafia.com/race.html, series.html).
# Цепочка: свежие леджеры и серии с mafgame → модель (data/research/model/run_all.py) → vault/race.json (шифр, пароль
# из секрета RACE_PASS) + data/series2026.js + официальный топ-50 в calendar.html и дата рейтинга в meta.js → CACHE_VERSION+1 → коммит. Vercel выкатывает по коммиту.
# Расписание: вс 23:00 UTC (пн 01:00 Прага) — после ночного refresh-data (22:00 UTC) и турниров выходных.
# Вручную: Actions → «Пересбор гонки за дюжину» → Run workflow. Правка этого файла или любого скрипта модели тоже запускает прогон.
# Без секрета RACE_PASS шаг модели останавливается (пароль в публичный репозиторий не кладём).
name: Пересбор гонки за дюжину

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * 0'
  push:
    paths:
      - '.github/workflows/rebuild-race.yml'
      - 'data/research/model/*.py'

permissions:
  contents: write

concurrency:
  group: rebuild-race
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить секрет RACE_PASS
        env:
          RACE_PASS: ${{ secrets.RACE_PASS }}
        run: |
          if [ -z "$RACE_PASS" ]; then echo "::error::секрет RACE_PASS не задан — Settings → Secrets and variables → Actions → New repository secret (Name RACE_PASS)"; exit 1; fi
          echo "секрет на месте"
      - name: Зависимости
        run: pip install --quiet numpy cryptography
      - name: Леджеры рейтинга
        run: python .github/scripts/fetch_ledgers.py
      - name: Серийники
        run: python .github/scripts/fetch_series.py
      - name: Модель → vault/race.json, data/series2026.js, sw.js
        env:
          RACE_PASS: ${{ secrets.RACE_PASS }}
        run: |
          if [ -z "$RACE_PASS" ]; then echo "::error::секрет RACE_PASS не задан — Settings → Secrets and variables → Actions → New repository secret"; exit 1; fi
          python data/research/model/run_all.py
      - name: Закоммитить
        # Сгенерированные файлы — полная замена, поэтому конфликтов с параллельными роботами (refresh-data, MCL)
        # не разбираем: откладываем свои файлы, встаём на свежий origin/main, кладём файлы обратно,
        # CACHE_VERSION считаем от того, что уже в origin (+1), коммитим и пушим с одним повтором.
        run: |
          git config user.name  "dovod-bot"
          git config user.email "noreply@dovod-mafia.com"
          FILES="vault/race.json data/series2026.js calendar.html data/meta.js"
          DIRS="data/research/ledger data/research/series"
          rm -rf /tmp/gen && mkdir -p /tmp/gen
          for f in $FILES; do mkdir -p /tmp/gen/$(dirname $f); cp $f /tmp/gen/$f; done
          for d in $DIRS; do mkdir -p /tmp/gen/$d; cp -r $d/. /tmp/gen/$d/; done
          for i in 1 2; do
            git fetch origin main && git reset --hard origin/main
            for f in $FILES; do cp /tmp/gen/$f $f; done
            for d in $DIRS; do cp -r /tmp/gen/$d/. $d/; done
            V=$(grep -o "dovod-v[0-9]*" sw.js | head -1 | sed 's/dovod-v//'); NEW=$((V+1))
            sed -i "s/const CACHE_VERSION = 'dovod-v$V';/const CACHE_VERSION = 'dovod-v$NEW';/" sw.js
            git add $FILES $DIRS sw.js
            if git diff --cached --quiet; then echo "изменений нет"; exit 0; fi
            git commit -m "гонка за дюжину: пересбор $(date -u +%d.%m.%Y) (леджеры, серии, модель, sw v$NEW)"
            if git push origin main; then echo "запушено (попытка $i)"; exit 0; fi
            echo "push отклонён — повтор"; git reset --hard HEAD~1 || true
          done
          echo "::error::не удалось запушить после 2 попыток"; exit 1
