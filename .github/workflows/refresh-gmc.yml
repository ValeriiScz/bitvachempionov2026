# Ежедневное обновление данных страницы GMC Europa 2026 (gmc2026.html).
# До 29.09.2026 страница жила вшитым снимком и протухала — теперь данные собирает робот.
# Запустить вручную: Actions → «Обновление данных GMC» → Run workflow.
name: Обновление данных GMC

on:
  schedule:
    # 05:00 UTC — утренний прогон.
    # ⚠ GitHub ставит запуски по расписанию в очередь и сдвигает их на часы:
    # фактический старт обычно 10–12 UTC. Поэтому слотов два, как у MCL.
    - cron: '0 5 * * *'
    # 20:00 UTC — вечерний: серия, сыгранная в выходной вечером, попадает на сайт
    # той же ночью, а не ждёт середины следующего дня.
    - cron: '0 20 * * *'
  workflow_dispatch:
  # правка самого робота запускает прогон — так его можно проверить сразу
  push:
    paths:
      - '.github/workflows/refresh-gmc.yml'
      - '.github/scripts/refresh_gmc.py'

permissions:
  contents: write

concurrency:
  group: refresh-gmc
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Обновить данные GMC
        run: python .github/scripts/refresh_gmc.py

      - name: Проверить датафайл
        run: |
          python - <<'PY'
          import io, json, re
          s = io.open('data/gmc2026.js', encoding='utf-8').read()
          d = json.loads(re.search(r'window\.GMC=(\{.*\});', s, re.S).group(1))
          assert d['series'], 'пустой список серий'
          assert d['qualified'], 'пустой список финалистов'
          assert d['kpi'], 'пустые KPI'
          played = len(d['series'])
          assert played >= 10, 'серий с протоколом всего %d' % played
          assert len(d['qualified']) <= played * 2, 'финалистов больше, чем слотов'
          print('датафайл в порядке: серий', played, '· финалистов', len(d['qualified']), '· снимок', d['snap'])
          PY

      - name: Закоммитить изменения
        run: |
          set -eu
          git config user.name  "dovod-bot"
          git config user.email "dovod-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "изменений нет — коммита не будет"
            exit 0
          fi
          git add -A
          git commit -m "GMC: автообновление данных $(date '+%d.%m.%Y')"
          git push
