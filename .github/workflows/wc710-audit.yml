# Аудит протоколов ЧМ-2026 (mafgame t710): снимок каждые 5 минут + журнал изменений.
# Живёт только в дни турнира — скрипт сам выходит вне окна 12–14.09.2026.
# Запустить вручную: Actions → «Аудит протоколов ЧМ-2026» → Run workflow.
name: Аудит протоколов ЧМ-2026

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wc710-audit.yml'
      - '.github/scripts/wc710_audit.py'

permissions:
  contents: write

concurrency:
  group: wc710-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Снять протоколы и сверить со снимком
        run: python .github/scripts/wc710_audit.py

      - name: Закоммитить, если что-то изменилось
        run: |
          if git diff --quiet; then
            echo "изменений нет — коммит не нужен"
            exit 0
          fi
          git config user.name  "dovod-bot"
          git config user.email "noreply@dovod-mafia.com"
          git add data/wc710_live.json data/wc710_audit.json
          git commit -m "ЧМ-2026: снимок протоколов $(date -u +%H:%M) UTC"
          git pull --rebase --autostash
          git push
